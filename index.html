              for (let b = 0; b < bolt.branches.length; b++) {
                const br = bolt.branches[b];
                if (br && br.length > 0) {
                  ctx.moveTo(br[0].x, br[0].y);
                  for (let j = 1; j < br.length; j++) {
                    ctx.lineTo(br[j].x, br[j].y);
                  }
                }
              }
            }
          };

          // Wider soft glow
          ctx.strokeStyle = `rgba(180,195,240,${weather.lightningFlash * 0.40})`;
          ctx.lineWidth = 8;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          traceBolt();
          ctx.stroke();

          // Thin bright core
          ctx.strokeStyle = `rgba(255,255,255,${weather.lightningFlash * 0.95})`;
          ctx.lineWidth = 1.8;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          traceBolt();
          ctx.stroke();
        }

        ctx.restore();
      }

      /* ═══════════════════════════════════════════════════════════════════
         WATERFALL EFFECT (monsoon mountain view) — Distant Natural Cascade
         ═══════════════════════════════════════════════════════════════════ */
      let _wfStreakTex = null;
      let _wfTintedTex = null, _wfTintedCtx = null;
      let _wfFlowRibbon = null, _wfFlowRibbonCtx = null;
      let _wfOffCanvas = null, _wfOffCtx = null;
      let _wfMaskCanvas = null, _wfMaskCtx = null;
      let _wfMistTex = null;
      let _wfFlecksTex = null;
      let _wfStoneTex = null;
      let _wfLastW = 0, _wfLastH = 0, _wfLastDpr = 0;
      let _wfSplineData = null;
      let _wfParticles = [];
      let _wfLastTime = 0;

      function _wfCatmullRom(p0, p1, p2, p3, t) {
        const t2 = t * t, t3 = t2 * t;
        return 0.5 * (
          (2 * p1) +
          (-p0 + p2) * t +
          (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
          (-p0 + 3 * p1 - 3 * p2 + p3) * t3
        );
      }

      function _wfSmoothstep(edge0, edge1, x) {
        const t = clamp((x - edge0) / (edge1 - edge0));
        return t * t * (3 - 2 * t);
      }

      function _wfRidgeYAt(points, noiseAmt, x) {
        const frac = x / W;
        if (!points || points.length === 0) return H;
        if (frac <= points[0][0]) {
          const p = points[0];
          let ny = p[1] * H;
          if (noiseAmt > 0) ny += simplex2(p[0] * 8 + 0.5, p[1] * 3) * noiseAmt * H;
          return ny;
        }
        const last = points[points.length - 1];
        if (frac >= last[0]) {
          let ny = last[1] * H;
          if (noiseAmt > 0) ny += simplex2(last[0] * 8 + 0.5, last[1] * 3) * noiseAmt * H;
          return ny;
        }
        for (let i = 0; i < points.length - 1; i++) {
          const p0 = points[i];
          const p1 = points[i + 1];
          if (frac >= p0[0] && frac <= p1[0]) {
            const span = p1[0] - p0[0];
            const lt = span > 0 ? (frac - p0[0]) / span : 0;
            let y0 = p0[1] * H;
            let y1 = p1[1] * H;
            if (noiseAmt > 0) {
              y0 += simplex2(p0[0] * 8 + 0.5, p0[1] * 3) * noiseAmt * H;
              y1 += simplex2(p1[0] * 8 + 0.5, p1[1] * 3) * noiseAmt * H;
            }
            return y0 + (y1 - y0) * lt;
          }
        }
        return last[1] * H;
      }

      function _wfFrontRidgeYAt(x) {
        if (typeof secondRidgePoints === 'undefined' || !secondRidgePoints || secondRidgePoints.length === 0) return H;
        if (x < secondRidgePoints[0][0] * W) return H;
        return _wfRidgeYAt(secondRidgePoints, 0.015, x);
      }

      function _wfInitTextures(w, h) {
        const curDpr = (typeof dpr === 'number') ? dpr : (window.devicePixelRatio || 1);
        if (_wfStreakTex && _wfLastW === w && _wfLastH === h && _wfLastDpr === curDpr) return;
        _wfLastW = w; _wfLastH = h; _wfLastDpr = curDpr;
        const sW = w / 1280;
        const sH = h / 800;

        // 1. Seamless shallow streak texture (stretched noise 18-35x along flow axis, 256x1024 with 512 period)
        // Rebuilt: NO regular grid, NO repeating dots, NO cross-hatch. Pure smooth simplex strands with lateral wander.
        _wfStreakTex = document.createElement("canvas");
        _wfStreakTex.width = 256;
        _wfStreakTex.height = 1024;
        const sctx = _wfStreakTex.getContext("2d");
        const sImg = sctx.createImageData(256, 512);
        const sData = sImg.data;

        for (let y = 0; y < 512; y++) {
          const phi = (y / 512) * TAU;
          const cy = Math.cos(phi);
          const sy = Math.sin(phi);
          // Subtle lateral wander as water meets micro-contours on rock
          const dw = 0.040 * Math.sin(phi + 1.3) + 0.018 * Math.cos(2.0 * phi + 0.6);

          for (let x = 0; x < 256; x++) {
            const u = x / 256;
            let up = (u + dw) % 1.0;
            if (up < 0) up += 1.0;

            // 4 octaves heavily stretched along flow (20x to 35x longer than wide)
            const n1 = simplex2(up * 11.0 + 2.3, cy * 0.45 + sy * 0.45 + 1.7);
            const n2 = simplex2(up * 25.0 + 5.1, cy * 0.85 - sy * 0.85 + 4.9);
            const n3 = simplex2(up * 50.0 + 9.8, cy * 1.60 + sy * 1.60 + 8.1);
            const n4 = simplex2(up * 92.0 + 14.2, cy * 2.80 - sy * 2.80 + 12.4);

            // Sparse thin bright filaments running faster and catching light
            const fil = Math.pow(Math.max(0, n4 - 0.18) / 0.82, 2.0);

            // Smooth strand intensity: soft low-contrast strands + a few thin bright filaments
            const strandVal = clamp(0.42 + 0.26 * n1 + 0.18 * n2 + 0.12 * n3 + 0.35 * fil, 0, 1);

            // Silvery-white with slight cool sheen & pale blue-green tint in thicker core
            const uDist = Math.abs(u - 0.5) * 2.0; // 0 at center, 1 at edges
            let r = 224 + 31 * strandVal;
            let g = 236 + 19 * strandVal;
            let b = 255;

            // Faint secondary pale blue-green tint in thicker core zones
            if (uDist < 0.55) {
              const tintAmt = (1.0 - uDist / 0.55) * 0.16;
              r = r * (1 - tintAmt) + 190 * tintAmt;
              g = g * (1 - tintAmt) + 230 * tintAmt;
              b = b * (1 - tintAmt) + 242 * tintAmt;
            }

            const idx = (y * 256 + x) * 4;
            sData[idx] = clamp(Math.round(r), 0, 255);
            sData[idx + 1] = clamp(Math.round(g), 0, 255);
            sData[idx + 2] = clamp(Math.round(b), 0, 255);
            // Opaque 255 in streak tile so overlapping segments on offscreen buffer NEVER multiply alpha
            sData[idx + 3] = 255;
          }
        }
        sctx.putImageData(sImg, 0, 0);
        // Seamless clone of top 512 into bottom 512: eliminates wrap clipping completely
        sctx.drawImage(_wfStreakTex, 0, 0, 256, 512, 0, 512, 256, 512);

        // 2. Tinted compositor texture (256x1024)
        _wfTintedTex = document.createElement("canvas");
        _wfTintedTex.width = 256;
        _wfTintedTex.height = 1024;
        _wfTintedCtx = _wfTintedTex.getContext("2d");

        // 3. Flow ribbon compositor (256x512)
        _wfFlowRibbon = document.createElement("canvas");
        _wfFlowRibbon.width = 256;
        _wfFlowRibbon.height = 512;
        _wfFlowRibbonCtx = _wfFlowRibbon.getContext("2d");

        // 4. Soft mist sprite (48x32)
        _wfMistTex = document.createElement("canvas");
        _wfMistTex.width = 48;
        _wfMistTex.height = 32;
        const mctx = _wfMistTex.getContext("2d");
        const mg = mctx.createRadialGradient(24, 16, 0, 24, 16, 22);
        mg.addColorStop(0, "rgba(255,255,255,0.36)");
        mg.addColorStop(0.35, "rgba(235,245,252,0.18)");
        mg.addColorStop(0.70, "rgba(210,230,245,0.05)");
        mg.addColorStop(1, "rgba(210,230,245,0)");
        mctx.fillStyle = mg;
        mctx.fillRect(0, 0, 48, 32);

        // 5. Elongated whitewater flecks and bubbles sprite (64 wide x 128 high, stretched along flow)
        _wfFlecksTex = document.createElement("canvas");
        _wfFlecksTex.width = 64;
        _wfFlecksTex.height = 128;
        const fctx = _wfFlecksTex.getContext("2d");
        const fImg = fctx.createImageData(64, 128);
        const fData = fImg.data;
        for (let fy = 0; fy < 128; fy++) {
          const ny = (fy - 64) / 54.0;
          for (let fx = 0; fx < 64; fx++) {
            const nx = (fx - 32) / 27.0;
            const dist = Math.hypot(nx, ny);
            if (dist >= 1.0) continue;
            // Stretched noisy bubbles/flecks along flow direction
            const grain = simplex2(fx * 0.75, fy * 0.22) * 0.52 + simplex2(fx * 1.8, fy * 0.55) * 0.35;
            if (grain > 0.02) {
              const falloff = (1.0 - dist) * _wfSmoothstep(0.02, 0.40, grain);
              const idx = (fy * 64 + fx) * 4;
              fData[idx] = 252;
              fData[idx + 1] = 254;
              fData[idx + 2] = 255;
              fData[idx + 3] = clamp(Math.round(falloff * 230), 0, 255);
            }
          }
        }
        fctx.putImageData(fImg, 0, 0);

        // 6. Pre-compute Path Spline & Bounds dynamically from Mountain Geometry
        let peakPt = mainPeakPoints[0];
        for (let i = 1; i < mainPeakPoints.length; i++) {
          if (mainPeakPoints[i][1] < peakPt[1]) peakPt = mainPeakPoints[i];
        }
        const peakFracX = peakPt[0]; // 0.47
        const stoneFracX = clamp(peakFracX + 0.12, 0.55, 0.63);
        const stoneX = stoneFracX * w;
        const stoneRidgeY = _wfRidgeYAt(mainPeakPoints, 0.012, stoneX);
        const stoneBaseY = stoneRidgeY + 0.055 * h;

        // Slope-relative control points: dx = horizontal offset from stoneX, depth = fraction of H below main ridge
        const cpOffsets = [
          { dx: 0.00, depth: 0.055 },
          { dx: 0.04, depth: 0.080 },
          { dx: 0.08, depth: 0.125 },
          { dx: 0.11, depth: 0.185 },
          { dx: 0.13, depth: 0.265 },
          { dx: 0.14, depth: 0.345 }
        ];

        const cps = cpOffsets.map(cp => {
          const x = stoneX + cp.dx * w;
          const rY = _wfRidgeYAt(mainPeakPoints, 0.012, x);
          const y = Math.max(rY + 0.02 * h, rY + cp.depth * h);
          return { x, y };
        });

        // Sample spline (120 steps)
        const rawSamples = [];
        const numSteps = 120;
        for (let s = 0; s <= numSteps; s++) {
          const tG = (s / numSteps) * (cps.length - 1);
          const seg = Math.min(cps.length - 2, Math.floor(tG));
          const t = tG - seg;

          const p0 = cps[Math.max(0, seg - 1)];
          const p1 = cps[seg];
          const p2 = cps[seg + 1];
          const p3 = cps[Math.min(cps.length - 1, seg + 2)];

          const x = _wfCatmullRom(p0.x, p1.x, p2.x, p3.x, t);
          let y = _wfCatmullRom(p0.y, p1.y, p2.y, p3.y, t);

          // Hillside constraint: y >= ridgeY(x) + 0.02*H
          const rY = _wfRidgeYAt(mainPeakPoints, 0.012, x);
          if (y < rY + 0.02 * h) y = rY + 0.02 * h;

          rawSamples.push({ x, y });
        }

        // Walk down from stream's start until y >= frontRidgeY(x), then continue 20px past
        let crossIdx = -1;
        for (let i = 0; i < rawSamples.length; i++) {
          const sm = rawSamples[i];
          const fy = _wfFrontRidgeYAt(sm.x);
          if (sm.y >= fy) {
            crossIdx = i;
            break;
          }
        }

        let stopIdx = rawSamples.length - 1;
        if (crossIdx !== -1) {
          let dPast = 0;
          stopIdx = crossIdx;
          for (let i = crossIdx + 1; i < rawSamples.length; i++) {
            const d = Math.hypot(rawSamples[i].x - rawSamples[i - 1].x, rawSamples[i].y - rawSamples[i - 1].y);
            dPast += d;
            stopIdx = i;
            if (dPast >= 20 * sW) break;
          }
        }

        const truncated = rawSamples.slice(0, stopIdx + 1);
        const samples = [];
        let totalArc = 0;

        for (let i = 0; i < truncated.length; i++) {
          const pt = truncated[i];
          if (i > 0) {
            const prev = samples[i - 1];
            const d = Math.hypot(pt.x - prev.x, pt.y - prev.y);
            totalArc += d;
            prev.len = d;
          }
          samples.push({ x: pt.x, y: pt.y, s: totalArc, len: 1.0 });
        }

        // Tangents, normals, and continuous acceleration coordinate (xi)
        const accelC = 0.55; // water accelerates 55% faster at lower end
        const maxXi = (totalArc / accelC) * Math.log(1 + accelC);
        for (let i = 0; i < samples.length; i++) {
          let tx, ty;
          if (i === 0) {
            tx = samples[1].x - samples[0].x;
            ty = samples[1].y - samples[0].y;
          } else if (i === samples.length - 1) {
            tx = samples[i].x - samples[i - 1].x;
            ty = samples[i].y - samples[i - 1].y;
          } else {
            tx = samples[i + 1].x - samples[i - 1].x;
            ty = samples[i + 1].y - samples[i - 1].y;
          }
          const tlen = Math.hypot(tx, ty) || 1;
          tx /= tlen; ty /= tlen;
          samples[i].tx = tx;
          samples[i].ty = ty;
          samples[i].nx = -ty;
          samples[i].ny = tx;
          samples[i].theta = Math.atan2(ty, tx);

          // Continuous Lagrangian coordinate along flow (never tears or shears over time)
          const uArc = samples[i].s / (totalArc || 1);
          const xi = (totalArc / accelC) * Math.log(1 + accelC * uArc);
          samples[i].ySource = (xi / (maxXi || 1)) * 512;
        }

        // Width profile & bounding box
        let minX = 99999, maxX = -99999, minY = 99999, maxY = -99999;
        for (let i = 0; i < samples.length; i++) {
          const sm = samples[i];
          const u = sm.s / (totalArc || 1);
          const baseW = (8.0 + 10.0 * u + 8.0 * u * u) * sW;

          // Irregular, soft feathered edges: low-frequency noise (±1.5-2.5 px) + high-frequency wobble (±0.7 px)
          const leftLow = simplex2(u * 4.2, 1.8) * 2.0 * sW;
          const rightLow = simplex2(u * 4.2, 6.5) * 2.0 * sW;
          const leftHigh = simplex2(u * 16.0, 3.4) * 0.7 * sW;
          const rightHigh = simplex2(u * 16.0, 8.7) * 0.7 * sW;

          const nominalHalfW = 0.5 * Math.max(7.0 * sW, baseW);
          sm.hwLeft = Math.max(3.2 * sW, nominalHalfW + leftLow + leftHigh);
          sm.hwRight = Math.max(3.2 * sW, nominalHalfW + rightLow + rightHigh);
          sm.hw = (sm.hwLeft + sm.hwRight) * 0.5;
          sm.u = u;

          let lx = sm.x - sm.nx * sm.hwLeft;
          let ly = sm.y - sm.ny * sm.hwLeft;
          let rx = sm.x + sm.nx * sm.hwRight;
          let ry = sm.y + sm.ny * sm.hwRight;

          // Hillside clamping on edges: y >= ridgeY(x) + 0.02*H
          const lrY = _wfRidgeYAt(mainPeakPoints, 0.012, lx);
          if (ly < lrY + 0.02 * h) ly = lrY + 0.02 * h;
          const rrY = _wfRidgeYAt(mainPeakPoints, 0.012, rx);
          if (ry < rrY + 0.02 * h) ry = rrY + 0.02 * h;

          minX = Math.min(minX, lx, rx);
          maxX = Math.max(maxX, lx, rx);
          minY = Math.min(minY, ly, ry);
          maxY = Math.max(maxY, ly, ry);
        }

        const bboxX = Math.floor(minX - 16);
        const bboxY = Math.floor(minY - 16);
        const bboxW = Math.ceil(maxX - minX + 32);
        const bboxH = Math.ceil(maxY - minY + 32);

        _wfOffCanvas = document.createElement("canvas");
        _wfOffCanvas.width = bboxW;
        _wfOffCanvas.height = bboxH;
        _wfOffCtx = _wfOffCanvas.getContext("2d");

        // 7. Pre-render 2D Feathered Mask (pre-rendered once! Replaces hard vector mask)
        // Cross section: flat body opacity in center (0.45-0.55), outer 30% smoothly feathers to 0.
        // Longitudinal: 5 whitewater zones boosted, bottom fades to 0 over last 25px past front ridge,
        // top originates from 3 narrow strands under stone.
        _wfMaskCanvas = document.createElement("canvas");
        _wfMaskCanvas.width = bboxW;
        _wfMaskCanvas.height = bboxH;
        _wfMaskCtx = _wfMaskCanvas.getContext("2d");

        const sEnd = totalArc;
        const numMaskRibbons = 8;
        for (let k = 0; k < numMaskRibbons; k++) {
          const fK = 1.0 - (k / numMaskRibbons) * 0.72; // outer 1.0 down to core 0.28
          const alphaInc = 0.065; // 8 layers accumulate smoothly to ~0.52 body opacity

          _wfMaskCtx.beginPath();
          // Left boundary
          for (let i = 0; i < samples.length; i++) {
            const sm = samples[i];
            // Bottom fade over last 25px past front ridge
            const endFade = sm.s < (sEnd - 25 * sW) ? 1.0 : _wfSmoothstep(sEnd, sEnd - 25 * sW, sm.s);
            const curHw = sm.hwLeft * fK * endFade;
            const px = sm.x - bboxX - sm.nx * curHw;
            const py = sm.y - bboxY - sm.ny * curHw;
            if (i === 0) _wfMaskCtx.moveTo(px, py); else _wfMaskCtx.lineTo(px, py);
          }
          // Right boundary
          for (let i = samples.length - 1; i >= 0; i--) {
            const sm = samples[i];
            const endFade = sm.s < (sEnd - 25 * sW) ? 1.0 : _wfSmoothstep(sEnd, sEnd - 25 * sW, sm.s);
            const curHw = sm.hwRight * fK * endFade;
            const px = sm.x - bboxX + sm.nx * curHw;
            const py = sm.y - bboxY + sm.ny * curHw;
            _wfMaskCtx.lineTo(px, py);
          }
          _wfMaskCtx.closePath();
          _wfMaskCtx.fillStyle = "rgba(255,255,255," + alphaInc + ")";
          _wfMaskCtx.fill();
        }

        // Pre-render whitewater opacity boost along the 5 whitewater stretches
        const wwCenters = [0.16, 0.35, 0.53, 0.71, 0.88];
        for (let p = 0; p < wwCenters.length; p++) {
          const sTarget = wwCenters[p] * totalArc;
          for (let i = 0; i < samples.length; i++) {
            const sm = samples[i];
            const dist = Math.abs(sm.s - sTarget);
            if (dist < 18 * sW) {
              const wwFade = (1 - dist / (18 * sW)) * 0.16;
              _wfMaskCtx.fillStyle = "rgba(255,255,255," + wwFade + ")";
              _wfMaskCtx.beginPath();
              _wfMaskCtx.arc(sm.x - bboxX, sm.y - bboxY, sm.hw * 0.75, 0, TAU);
              _wfMaskCtx.fill();
            }
          }
        }

        // Top emergence: cut 2 narrow clefts over first 10px so water touches stone as 3 narrow merging strands
        _wfMaskCtx.save();
        _wfMaskCtx.globalCompositeOperation = "destination-out";
        for (let i = 0; i < Math.min(10, samples.length); i++) {
          const sm = samples[i];
          const topFade = (1.0 - i / 10.0);
          const rW = 1.2 * sW * topFade;
          // Left cleft
          _wfMaskCtx.beginPath();
          _wfMaskCtx.arc(sm.x - bboxX - sm.nx * (sm.hwLeft * 0.35), sm.y - bboxY - sm.ny * (sm.hwLeft * 0.35), rW, 0, TAU);
          _wfMaskCtx.fill();
          // Right cleft
          _wfMaskCtx.beginPath();
          _wfMaskCtx.arc(sm.x - bboxX + sm.nx * (sm.hwRight * 0.35), sm.y - bboxY + sm.ny * (sm.hwRight * 0.35), rW, 0, TAU);
          _wfMaskCtx.fill();
        }
        _wfMaskCtx.restore();

        // 8. Pre-generate Boulder Cluster at the source (proportional & below ridge)
        _wfStoneTex = document.createElement("canvas");
        _wfStoneTex.width = Math.ceil(48 * sW);
        _wfStoneTex.height = Math.ceil(28 * sH);
        const bctx = _wfStoneTex.getContext("2d");
        const bW = _wfStoneTex.width, bH = _wfStoneTex.height;

        // Contact shadow
        bctx.fillStyle = "rgba(12,20,15,0.75)";
        bctx.beginPath();
        bctx.ellipse(bW * 0.48, bH * 0.82, bW * 0.42, bH * 0.16, 0, 0, TAU);
        bctx.fill();

        // Left flank stone
        bctx.fillStyle = "rgb(36,48,40)";
        bctx.beginPath();
        bctx.moveTo(bW * 0.12, bH * 0.82);
        bctx.lineTo(bW * 0.08, bH * 0.58);
        bctx.lineTo(bW * 0.22, bH * 0.44);
        bctx.lineTo(bW * 0.32, bH * 0.62);
        bctx.lineTo(bW * 0.28, bH * 0.84);
        bctx.closePath();
        bctx.fill();

        // Right flank stone
        bctx.fillStyle = "rgb(34,46,38)";
        bctx.beginPath();
        bctx.moveTo(bW * 0.68, bH * 0.84);
        bctx.lineTo(bW * 0.72, bH * 0.52);
        bctx.lineTo(bW * 0.88, bH * 0.46);
        bctx.lineTo(bW * 0.94, bH * 0.72);
        bctx.lineTo(bW * 0.86, bH * 0.86);
        bctx.closePath();
        bctx.fill();

        // Main angular boulder
        bctx.fillStyle = "rgb(44,58,48)";
        bctx.beginPath();
        bctx.moveTo(bW * 0.20, bH * 0.80);
        bctx.lineTo(bW * 0.16, bH * 0.52);
        bctx.lineTo(bW * 0.28, bH * 0.24);
        bctx.lineTo(bW * 0.48, bH * 0.18);
        bctx.lineTo(bW * 0.68, bH * 0.28);
        bctx.lineTo(bW * 0.78, bH * 0.48);
        bctx.lineTo(bW * 0.76, bH * 0.78);
        bctx.lineTo(bW * 0.46, bH * 0.82);
        bctx.closePath();
        bctx.fill();

        // Shadow side of main boulder
        bctx.fillStyle = "rgba(22,32,24,0.65)";
        bctx.beginPath();
        bctx.moveTo(bW * 0.48, bH * 0.18);
        bctx.lineTo(bW * 0.68, bH * 0.28);
        bctx.lineTo(bW * 0.78, bH * 0.48);
        bctx.lineTo(bW * 0.76, bH * 0.78);
        bctx.lineTo(bW * 0.52, bH * 0.76);
        bctx.lineTo(bW * 0.46, bH * 0.48);
        bctx.closePath();
        bctx.fill();

        // Highlight along sky-facing top rim
        bctx.strokeStyle = "rgba(125,150,135,0.75)";
        bctx.lineWidth = Math.max(1.0, 1.2 * sW);
        bctx.beginPath();
        bctx.moveTo(bW * 0.18, bH * 0.50);
        bctx.lineTo(bW * 0.28, bH * 0.24);
        bctx.lineTo(bW * 0.48, bH * 0.18);
        bctx.lineTo(bW * 0.68, bH * 0.28);
        bctx.stroke();

        // Fissure cracks
        bctx.strokeStyle = "rgba(16,24,18,0.70)";
        bctx.lineWidth = Math.max(0.8, 1.0 * sW);
        bctx.beginPath();
        bctx.moveTo(bW * 0.44, bH * 0.24);
        bctx.lineTo(bW * 0.42, bH * 0.48);
        bctx.lineTo(bW * 0.38, bH * 0.64);
        bctx.stroke();

        // Moss tufts at boulder base
        bctx.fillStyle = "rgba(42,76,38,0.85)";
        for (let mi = 0; mi < 5; mi++) {
          const tx = bW * (0.24 + mi * 0.12);
          const ty = bH * 0.78 + (mi % 2) * 2;
          bctx.beginPath();
          bctx.arc(tx, ty, 2.5 * sW, 0, TAU);
          bctx.fill();
        }

        const stoneBx = stoneX - bW * 0.48;
        const stoneBy = stoneBaseY - bH * 0.72;

        _wfSplineData = {
          samples,
          totalArc,
          bboxX,
          bboxY,
          bboxW,
          bboxH,
          stoneX,
          stoneBaseY,
          stoneBx,
          stoneBy,
          endPt: samples[samples.length - 1]
        };
      }

      let _wfLoggedError = false;

      function drawWaterfalls(now, seasonParams, night, intensity) {
        try {
          if (typeof urlParams !== 'undefined' && urlParams) {
            if (urlParams.has('waterfall')) waterfallLevel = parseFloat(urlParams.get('waterfall'));
            if (typeof night !== 'number' && urlParams.has('night')) night = parseFloat(urlParams.get('night'));
          }
          if (waterfallLevel <= 0.001 || seasonParams.season !== 'MONSOON') return;
          night = typeof night === 'number' ? night : (
            (typeof minute === 'number' && typeof sunFactor === 'function') ? (1 - sunFactor(minute)) : 0
          );
          intensity = typeof intensity === 'number' ? intensity : 0.8;

          const a = _wfSmoothstep(0.04, 0.30, waterfallLevel);
          if (a <= 0.01) return;
          const vol = _wfSmoothstep(0.15, 0.85, waterfallLevel);
          const volWidth = 0.50 + 0.50 * vol;

          _wfInitTextures(W, H);
          const data = _wfSplineData;
          if (!data) return;

          const sW = W / 1280;
          const sH = H / 800;

          // Lighting calculations
          const darkness = (weather && typeof weather.darkness === 'number') ? weather.darkness : 0;
          const lightMul = clamp(
            0.55 * (1 - 0.88 * night) * (1 - 0.65 * darkness) + 0.45 * intensity * (1 - 0.7 * night),
            0.12,
            1.0
          );
          const k = 0.55 + 0.45 * lightMul;

          // Water color grading:
          // Day: silvery-white [238, 246, 255] with cool sheen
          // Dusk/Storm: cool blue-grey [125, 158, 202]
          // Night: deep cool blue-grey [92, 126, 172]
          let wc = lerpColor([238, 246, 255], [125, 158, 202], night);
          if (darkness > 0.05) {
            wc = lerpColor(wc, [102, 132, 168], darkness * 0.55);
          }
          const W1 = [wc[0] * k, wc[1] * k, wc[2] * k];

          // 1. Update Tinted texture using multiply to preserve highlights and contrast
          _wfTintedCtx.clearRect(0, 0, 256, 1024);
          _wfTintedCtx.drawImage(_wfStreakTex, 0, 0);
          _wfTintedCtx.globalCompositeOperation = "multiply";
          _wfTintedCtx.fillStyle = "rgb(" + (W1[0] | 0) + "," + (W1[1] | 0) + "," + (W1[2] | 0) + ")";
          _wfTintedCtx.fillRect(0, 0, 256, 1024);
          _wfTintedCtx.globalCompositeOperation = "destination-in";
          _wfTintedCtx.drawImage(_wfStreakTex, 0, 0);
          _wfTintedCtx.globalCompositeOperation = "source-over";

          // 2. Composite Flow Ribbon (3 scrolling layers at different speeds: 1.0x, 1.6x, 0.65x)
          _wfFlowRibbonCtx.clearRect(0, 0, 256, 512);

          // Layer 1: Base shallow sheet (speed 1.0x)
          const v1 = (now * 0.16) % 512;
          _wfFlowRibbonCtx.globalAlpha = 0.50;
          _wfFlowRibbonCtx.drawImage(_wfTintedTex, 0, v1, 256, 512, 0, 0, 256, 512);

          // Layer 2: Fast fine filaments (speed 1.6x, horizontally scaled/shifted)
          const v2 = (now * 0.26 + 180) % 512;
          _wfFlowRibbonCtx.globalAlpha = 0.32 * k;
          _wfFlowRibbonCtx.drawImage(_wfTintedTex, 36, v2, 184, 512, 0, 0, 256, 512);

          // Layer 3: Slow deeper strands (speed 0.65x, horizontally shifted)
          const v3 = (now * 0.10 + 340) % 512;
          _wfFlowRibbonCtx.globalAlpha = 0.22;
          _wfFlowRibbonCtx.drawImage(_wfTintedTex, 0, v3, 256, 512, 0, 0, 256, 512);

          _wfFlowRibbonCtx.globalAlpha = 1.0;

          const samples = data.samples;
          const bboxX = data.bboxX, bboxY = data.bboxY;
          const bboxW = data.bboxW, bboxH = data.bboxH;

          // 3. Map Flow Ribbon onto Offscreen Canvas along the stream spline
          _wfOffCtx.clearRect(0, 0, bboxW, bboxH);

          for (let i = 0; i < samples.length - 1; i++) {
            const s1 = samples[i], s2 = samples[i + 1];
            const mx = (s1.x + s2.x) * 0.5 - bboxX;
            const my = (s1.y + s2.y) * 0.5 - bboxY;
            const segLen = s1.len;
            const hw = ((s1.hwLeft + s1.hwRight + s2.hwLeft + s2.hwRight) * 0.25) * volWidth;
            const w = hw * 2.0;

            const sy = s1.ySource;
            const sH = Math.max(1, s2.ySource - s1.ySource);

            _wfOffCtx.save();
            _wfOffCtx.translate(mx, my);
            _wfOffCtx.rotate(s1.theta - Math.PI * 0.5);

            // Render slice with globalAlpha = 1.0 (no alpha multiplication at segment joints!)
            _wfOffCtx.drawImage(_wfFlowRibbon, 0, sy, 256, sH, -w * 0.5, -segLen * 0.5, w, segLen + 0.35);

            _wfOffCtx.restore();
          }

          // Apply pre-rendered continuous feathered mask (destination-in eliminates all seams & cuts)
          _wfOffCtx.globalCompositeOperation = "destination-in";
          _wfOffCtx.drawImage(_wfMaskCanvas, 0, 0);
          _wfOffCtx.globalCompositeOperation = "source-over";

          // 4. MAIN CANVAS COMPOSITING
          ctx.save();
          try {
            // Dual clip: strictly inside main mountain (below main ridge) AND above front ridge
            ctx.beginPath();
            ctx.moveTo(mainPeakPoints[0][0] * W, H);
            for (let i = 0; i < mainPeakPoints.length; i++) {
              ctx.lineTo(
                mainPeakPoints[i][0] * W,
                mainPeakPoints[i][1] * H + simplex2(mainPeakPoints[i][0] * 8 + 0.5, mainPeakPoints[i][1] * 3) * 0.012 * H
              );
            }
            ctx.lineTo(W, H);
            ctx.closePath();
            ctx.clip();

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(W, 0);
            ctx.lineTo(W, H);
            for (let i = secondRidgePoints.length - 1; i >= 0; i--) {
              const rx = secondRidgePoints[i][0] * W;
              const ry = secondRidgePoints[i][1] * H + simplex2(secondRidgePoints[i][0] * 8 + 0.5, secondRidgePoints[i][1] * 3) * 0.015 * H;
              ctx.lineTo(rx, ry);
            }
            ctx.lineTo(secondRidgePoints[0][0] * W, H);
            ctx.lineTo(0, H);
            ctx.closePath();
            ctx.clip();

            // Faint narrow wet rock fringe on hillside just outside water (alpha <= 0.08)
            ctx.strokeStyle = "rgba(10,18,14," + (0.07 * a) + ")";
            ctx.lineWidth = Math.max(1.0, 1.8 * sW);
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.beginPath();
            for (let i = 0; i < samples.length; i++) {
              const sm = samples[i];
              const lx = sm.x - sm.nx * (sm.hwLeft * volWidth + 1.2 * sW);
              const ly = sm.y - sm.ny * (sm.hwLeft * volWidth + 1.2 * sW);
              if (i === 0) ctx.moveTo(lx, ly); else ctx.lineTo(lx, ly);
            }
            ctx.stroke();

            ctx.beginPath();
            for (let i = 0; i < samples.length; i++) {
              const sm = samples[i];
              const rx = sm.x + sm.nx * (sm.hwRight * volWidth + 1.2 * sW);
              const ry = sm.y + sm.ny * (sm.hwRight * volWidth + 1.2 * sW);
              if (i === 0) ctx.moveTo(rx, ry); else ctx.lineTo(rx, ry);
            }
            ctx.stroke();

            // Draw the flowing water film with subtle brightness shimmer (drift modulating opacity by +-10%)
            const shimmer = 1.0 + 0.10 * Math.sin(now * 0.002) + 0.05 * Math.cos(now * 0.0035);
            ctx.globalAlpha = clamp(a * shimmer, 0, 1);
            ctx.drawImage(_wfOffCanvas, bboxX, bboxY);

            // 4-6 Whitewater patches with elongated soft flecks and bubbles
            const patchRatios = [0.16, 0.35, 0.53, 0.71, 0.88];
            for (let p = 0; p < patchRatios.length; p++) {
              const pr = patchRatios[p];
              const sIdx = Math.min(samples.length - 1, Math.round(pr * (samples.length - 1)));
              const sm = samples[sIdx];
              const pw = sm.hw * 1.30 * volWidth;
              const ph = Math.max(14 * sW, (16 + 8 * pr) * sW); // Elongated along flow!
              const pPulse = 0.42 + 0.18 * Math.sin(now * 0.0035 + p * 2.2);

              ctx.save();
              ctx.translate(sm.x, sm.y);
              ctx.rotate(sm.theta - Math.PI * 0.5);
              ctx.globalAlpha = clamp(pPulse * a * (0.50 + 0.50 * k), 0, 1);
              ctx.drawImage(_wfFlecksTex, -pw * 0.5, -ph * 0.5, pw, ph);
              ctx.restore();
            }

            // BOULDER CLUSTER AT THE SOURCE (drawn AFTER water so lower edge covers start with zero gap)
            {
              ctx.save();
              ctx.globalAlpha = clamp(0.96 * (0.65 + 0.35 * k), 0, 1);
              ctx.drawImage(_wfStoneTex, data.stoneBx, data.stoneBy);
              ctx.restore();
            }

            // BASE: Mist and spray rising from behind the front ridge
            {
              const endPt = data.endPt;
              const endHw = endPt.hw * volWidth;
              const splashX = endPt.x, splashY = endPt.y;

              // Faint natural trickle continuing downhill into front ridge crease
              ctx.strokeStyle = "rgba(" + (W1[0] | 0) + "," + (W1[1] | 0) + "," + (W1[2] | 0) + "," + (0.24 * a * k) + ")";
              ctx.lineWidth = Math.max(0.8 * sW, 1.2 * sW * volWidth);
              ctx.beginPath();
              ctx.moveTo(splashX, splashY + 2 * sH);
              ctx.quadraticCurveTo(splashX + 3 * sW, splashY + 12 * sH, splashX + 1 * sW, splashY + 22 * sH);
              ctx.stroke();

              // Directional broken spray flecks
              const spW = endHw * 1.8 + 6 * sW * vol;
              const spH = endHw * 1.0 + 3 * sW * vol;
              ctx.save();
              ctx.translate(splashX, splashY);
              ctx.rotate(endPt.theta - Math.PI * 0.5);
              ctx.globalAlpha = clamp(0.55 * a * k * (1 + 0.12 * Math.sin(now * 0.004)), 0, 1);
              ctx.drawImage(_wfFlecksTex, -spW * 0.5, -spH * 0.35, spW, spH);
              ctx.restore();
            }

            // Rising mist particles (capped <= 50, drifting with weather.wind)
            {
              const dt = clamp((now - (_wfLastTime || now)) * 0.001, 0.001, 0.05);
              _wfLastTime = now;

              const targetParticles = Math.min(42, Math.round(12 + 22 * vol));
              const windVal = (weather && typeof weather.wind === 'number') ? weather.wind : 0.2;
              while (_wfParticles.length < targetParticles) {
                const pRatio = Math.random();
                let ox, oy;
                if (pRatio < 0.72) {
                  ox = data.endPt.x; oy = data.endPt.y;
                } else {
                  const midSample = samples[Math.round(samples.length * (0.35 + 0.45 * Math.random()))];
                  ox = midSample.x; oy = midSample.y;
                }
                _wfParticles.push({
                  x: ox + (Math.random() - 0.5) * 10 * sW,
                  y: oy + (Math.random() - 0.5) * 5 * sW,
                  vx: (Math.random() - 0.5) * 4 * sW + windVal * 10,
                  vy: -(0.010 + Math.random() * 0.018) * H,
                  size: W * (0.005 + Math.random() * 0.005),
                  maxSize: W * (0.012 + Math.random() * 0.008),
                  life: Math.random(),
                  maxLife: 1.2 + Math.random() * 1.6,
                  baseAlpha: 0.15 + Math.random() * 0.15,
                  seed: Math.random() * 100
                });
              }
              if (_wfParticles.length > targetParticles) {
                _wfParticles.length = targetParticles;
              }

              for (let i = _wfParticles.length - 1; i >= 0; i--) {
                const p = _wfParticles[i];
                p.life += dt / p.maxLife;
                if (p.life >= 1.0) {
                  p.life = 0;
                  const pRatio = Math.random();
                  let ox, oy;
                  if (pRatio < 0.72) {
                    ox = data.endPt.x; oy = data.endPt.y;
                  } else {
                    const midSample = samples[Math.round(samples.length * (0.35 + 0.45 * Math.random()))];
                    ox = midSample.x; oy = midSample.y;
                  }
                  p.x = ox + (Math.random() - 0.5) * 10 * sW;
                  p.y = oy + (Math.random() - 0.5) * 5 * sW;
                  p.vx = (Math.random() - 0.5) * 4 * sW + windVal * 10;
                  p.vy = -(0.010 + Math.random() * 0.018) * H;
                }

                p.x += (p.vx + Math.sin(now * 0.002 + p.seed) * 2.0) * dt;
                p.y += p.vy * dt;
                const curSize = mix(p.size, p.maxSize, p.life);
                const pAlpha = Math.sin(p.life * PI) * p.baseAlpha * a * (0.40 + 0.50 * k);
                if (pAlpha > 0.01) {
                  ctx.globalAlpha = pAlpha;
                  ctx.drawImage(_wfMistTex, p.x - curSize, p.y - curSize * 0.45, curSize * 2, curSize * 0.9);
                }
              }
            }
          } finally {
            ctx.restore();
          }
        } catch (err) {
          if (!_wfLoggedError) {
            _wfLoggedError = true;
            console.error('Error in drawWaterfalls:', err);
          }
        }
      }

      /* ═══════════════════════════════════════════════════════════════════
         4) MOUNTAIN VIEW — Western Ghats (Sahyadri) redesign
         ═══════════════════════════════════════════════════════════════════ */
      // Hand-shaped polyline for main peak
      const mainPeakPoints = [
        [0.00, 0.78], [0.04, 0.76], [0.10, 0.73], [0.15, 0.70], [0.20, 0.64], [0.25, 0.58],
        [0.30, 0.52], [0.34, 0.47], [0.38, 0.43], [0.41, 0.40], [0.44, 0.38], [0.47, 0.37],
        [0.49, 0.38], [0.51, 0.40], [0.53, 0.42], [0.56, 0.44], [0.60, 0.48], [0.65, 0.52],
        [0.70, 0.55], [0.75, 0.57], [0.80, 0.60], [0.85, 0.62], [0.90, 0.64], [0.95, 0.67], [1.00, 0.70]
      ];

      // Second ridge (darker, far right)
      const secondRidgePoints = [
        [0.55, 0.72], [0.60, 0.68], [0.65, 0.65], [0.70, 0.60], [0.75, 0.56], [0.78, 0.54],
        [0.82, 0.55], [0.86, 0.58], [0.90, 0.55], [0.94, 0.52], [0.97, 0.54], [1.00, 0.58]
      ];

      // Far pale ridges
      const farRidge1 = [[0, 0.72], [0.08, 0.69], [0.18, 0.66], [0.28, 0.63], [0.38, 0.60], [0.50, 0.58], [0.62, 0.60], [0.72, 0.62], [0.82, 0.60], [0.92, 0.63], [1, 0.65]];
      const farRidge2 = [[0, 0.75], [0.12, 0.72], [0.24, 0.68], [0.36, 0.65], [0.48, 0.63], [0.60, 0.65], [0.72, 0.68], [0.84, 0.65], [1, 0.68]];

      // Foreground conifers (real silhouettes: layered triangles of varied height and width)
      const CONIFER_TREES = Array.from({ length: 44 }, (_, i) => ({
        x: (i + 0.35 + randSeed(i * 17 + 8100) * 0.45) / 44,
        baseY: 0.94 + randSeed(i * 19 + 8200) * 0.05,
        height: 0.11 + randSeed(i * 23 + 8300) * 0.08,
        width: 0.026 + randSeed(i * 29 + 8400) * 0.016,
        tiers: 3 + (i % 3)
      }));

      function drawMountainShape(points, fillStyle, strokeStyle, alpha, noiseAmt) {
        ctx.save();
        if (alpha < 1) ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (let i = 0; i < points.length; i++) {
          let nx = points[i][0] * W;
          let ny = points[i][1] * H;
          if (noiseAmt > 0) {
            ny += simplex2(points[i][0] * 8 + 0.5, points[i][1] * 3) * noiseAmt * H;
          }
          if (i === 0) ctx.lineTo(nx, ny);
          else ctx.lineTo(nx, ny);
        }
        ctx.lineTo(W, H);
        ctx.closePath();
        ctx.fillStyle = fillStyle;
        ctx.fill();
        if (strokeStyle) {
          ctx.beginPath();
          for (let i = 0; i < points.length; i++) {
            let nx = points[i][0] * W;
            let ny = points[i][1] * H;
            if (noiseAmt > 0) ny += simplex2(points[i][0] * 8 + 0.5, points[i][1] * 3) * noiseAmt * H;
            if (i === 0) ctx.moveTo(nx, ny);
            else ctx.lineTo(nx, ny);
          }
          ctx.strokeStyle = strokeStyle; ctx.lineWidth = 1.2; ctx.stroke();
        }
        ctx.restore();
      }

      function ridgeYAt(points, noiseAmt, x) {
        const u = clamp(x > 1.05 ? x / W : x, 0, 1);
        for (let i = 0; i < points.length - 1; i++) {
          const x0 = points[i][0];
          const x1 = points[i + 1][0];
          if (u >= x0 && u <= x1) {
            const span = x1 - x0;
            const t = span > 0 ? (u - x0) / span : 0;
            let y0 = points[i][1] * H;
            let y1 = points[i + 1][1] * H;
            if (noiseAmt > 0) {
              y0 += simplex2(points[i][0] * 8 + 0.5, points[i][1] * 3) * noiseAmt * H;
              y1 += simplex2(points[i + 1][0] * 8 + 0.5, points[i + 1][1] * 3) * noiseAmt * H;
            }
            return y0 + (y1 - y0) * t;
          }
        }
        return points[points.length - 1][1] * H;
      }

      /* ── LOW CLOUD PRE-RENDERED TEXTURE ── */
      const LOW_CLOUD_W = 1024;
      const LOW_CLOUD_H = 192;
      let _lowCloudTex = null, _lowCloudTexCtx = null;
      let _lowCloudCompCanvas = null, _lowCloudCompCtx = null;
      let _lowCloudImgData = null;
      let _lowCloudRow = 0;
      let _lowCloudTexReady = false;

      function initLowCloudCanvases() {
        if (!_lowCloudTex) {
          _lowCloudTex = document.createElement('canvas');
          _lowCloudTex.width = LOW_CLOUD_W;
          _lowCloudTex.height = LOW_CLOUD_H;
          _lowCloudTexCtx = _lowCloudTex.getContext('2d');

          _lowCloudCompCanvas = document.createElement('canvas');
          _lowCloudCompCanvas.width = 512;
          _lowCloudCompCanvas.height = 128;
          _lowCloudCompCtx = _lowCloudCompCanvas.getContext('2d');

          _lowCloudImgData = _lowCloudTexCtx.createImageData(LOW_CLOUD_W, LOW_CLOUD_H);
        }
      }

      function computeLowCloudRows(startRow, endRow) {
        const data = _lowCloudImgData.data;
        for (let py = startRow; py < endRow; py++) {
          const v = py / LOW_CLOUD_H;
          const vertical = smoothstep(0.0, 0.60, v) * (1 - smoothstep(0.82, 1.0, v));

          for (let px = 0; px < LOW_CLOUD_W; px++) {
            const u = px / LOW_CLOUD_W;
            const w = u * u * (3 - 2 * u);
            const uA = u * 6.0;
            const uB = (u - 1.0) * 6.0;
            const vY = v * 2.2;
            const nA = fbm(uA, vY, 4);
            const nB = fbm(uB, vY, 4);
            const density = (1 - w) * nA + w * nB;
            const mask = smoothstep(0.30, 0.75, density);
            const alpha = mask * vertical;

            const idx = (py * LOW_CLOUD_W + px) * 4;
            data[idx] = 255;
            data[idx + 1] = 255;
            data[idx + 2] = 255;
            data[idx + 3] = Math.round(clamp(alpha, 0, 1) * 255);
          }
        }
      }

      function stepLowCloudBuild() {
        if (_lowCloudTexReady) return;
        initLowCloudCanvases();
        const chunkSize = 16;
        const endRow = Math.min(LOW_CLOUD_H, _lowCloudRow + chunkSize);
        computeLowCloudRows(_lowCloudRow, endRow);
        _lowCloudRow = endRow;

        if (_lowCloudRow >= LOW_CLOUD_H) {
          _lowCloudTexCtx.putImageData(_lowCloudImgData, 0, 0);
          _lowCloudTexReady = true;
        } else {
          if (typeof requestIdleCallback === 'function') {
            requestIdleCallback(stepLowCloudBuild);
          } else if (typeof setTimeout === 'function') {
            setTimeout(stepLowCloudBuild, 0);
          } else {
            finishLowCloudBuild();
          }
        }
      }

      function finishLowCloudBuild() {
        if (_lowCloudTexReady) return;
        initLowCloudCanvases();
        if (_lowCloudRow < LOW_CLOUD_H) {
          computeLowCloudRows(_lowCloudRow, LOW_CLOUD_H);
          _lowCloudTexCtx.putImageData(_lowCloudImgData, 0, 0);
          _lowCloudRow = LOW_CLOUD_H;
          _lowCloudTexReady = true;
        }
      }

      function buildLowCloudTex() {
        _lowCloudTexReady = false;
        _lowCloudRow = 0;
        stepLowCloudBuild();
      }

      function drawLowCloudBand(yBot, bandH, driftOffset, alphaMult, xLeft, bandWidth, isWisps, col, baseAlpha) {
        if (!_lowCloudTexReady) finishLowCloudBuild();
        const cw = _lowCloudCompCanvas.width;
        const ch = _lowCloudCompCanvas.height;
        const cc = _lowCloudCompCtx;
        cc.clearRect(0, 0, cw, ch);

        const scroll = (((driftOffset * (cw / bandWidth)) % cw) + cw) % cw;
        cc.drawImage(_lowCloudTex, -scroll, 0, cw, ch);
        cc.drawImage(_lowCloudTex, -scroll + cw, 0, cw, ch);

        if (isWisps) {
          cc.globalCompositeOperation = 'destination-in';
          const edgeFade = cc.createLinearGradient(0, 0, cw, 0);
          edgeFade.addColorStop(0, 'rgba(0,0,0,0)');
          edgeFade.addColorStop(0.15, 'rgba(0,0,0,1)');
          edgeFade.addColorStop(0.85, 'rgba(0,0,0,1)');
          edgeFade.addColorStop(1, 'rgba(0,0,0,0)');
          cc.fillStyle = edgeFade;
          cc.fillRect(0, 0, cw, ch);
        }

        cc.globalCompositeOperation = 'source-in';
        cc.fillStyle = rgb(col);
        cc.fillRect(0, 0, cw, ch);
        cc.globalCompositeOperation = 'source-over';

        ctx.save();
        ctx.globalAlpha = clamp(baseAlpha * alphaMult, 0, 0.80);
        ctx.drawImage(_lowCloudCompCanvas, xLeft, yBot - bandH, bandWidth, bandH);
        ctx.restore();
      }

      /* ── MIST PRE-RENDERED TEXTURE ── */
      const MIST_W = 1024;
      const MIST_H = 96;
      let _mistTex = null, _mistTexCtx = null;
      let _mistCompCanvas = null, _mistCompCtx = null;
      let _mistTexReady = false;

      function buildMistTexture() {
        if (!_mistTex) {
          _mistTex = document.createElement('canvas');
          _mistTex.width = MIST_W;
          _mistTex.height = MIST_H;
          _mistTexCtx = _mistTex.getContext('2d');

          _mistCompCanvas = document.createElement('canvas');
          _mistCompCanvas.width = MIST_W;
          _mistCompCanvas.height = MIST_H;
          _mistCompCtx = _mistCompCanvas.getContext('2d');
        }
        const imgData = _mistTexCtx.createImageData(MIST_W, MIST_H);
        const data = imgData.data;

        const mistYTop = 0.58 * H;
        const mistYBot = 0.78 * H;
        const mistSpan = mistYBot - mistYTop;
        const topDist = 0.035 * H;
        const botDist = 0.012 * H;

        for (let px = 0; px < MIST_W; px++) {
          const u = px / MIST_W;
          const w = u * u * (3 - 2 * u);

          const ryA = ridgeYAt(farRidge2, 0.01, u * W);
          const ry0 = ridgeYAt(farRidge2, 0.01, 0);
          const ry = (1 - w) * ryA + w * ry0;

          const nA = fbm(u * 5.0, 1.8, 3);
          const nB = fbm((u - 1.0) * 5.0, 1.8, 3);
          const mask = smoothstep(0.20, 0.70, (1 - w) * nA + w * nB);

          for (let py = 0; py < MIST_H; py++) {
            const sy = mistYTop + (py / (MIST_H - 1)) * mistSpan;
            let vert = 0;
            if (sy >= ry - topDist && sy <= ry) {
              vert = (sy - (ry - topDist)) / topDist;
            } else if (sy > ry && sy <= ry + botDist) {
              vert = 1 - (sy - ry) / botDist;
            }
            const alpha = vert * mask;

            const idx = (py * MIST_W + px) * 4;
            data[idx] = 255;
            data[idx + 1] = 255;
            data[idx + 2] = 255;
            data[idx + 3] = Math.round(clamp(alpha, 0, 1) * 255);
          }
        }
        _mistTexCtx.putImageData(imgData, 0, 0);
        _mistTexReady = true;
      }

      stepLowCloudBuild();
      buildMistTexture();
      _bootDone = true;

      function drawSlopeLighting(points, noiseAmt, L, intensity) {
        ctx.save();
        ctx.beginPath();
        const startX = points[0][0] * W;
        let startY = points[0][1] * H;
        if (noiseAmt > 0) startY += simplex2(points[0][0] * 8 + 0.5, points[0][1] * 3) * noiseAmt * H;
        ctx.moveTo(startX, H);
        ctx.lineTo(startX, startY);
        for (let i = 1; i < points.length; i++) {
          const nx = points[i][0] * W;
          let ny = points[i][1] * H;
          if (noiseAmt > 0) ny += simplex2(points[i][0] * 8 + 0.5, points[i][1] * 3) * noiseAmt * H;
          ctx.lineTo(nx, ny);
        }
        ctx.lineTo(points[points.length - 1][0] * W, H);
        ctx.closePath();
        ctx.clip();

        const fadeH = H * 0.20;
        const ambient = 0.55;

        for (let i = 0; i < points.length - 1; i++) {
          const x0 = points[i][0] * W;
          let y0 = points[i][1] * H;
          if (noiseAmt > 0) y0 += simplex2(points[i][0] * 8 + 0.5, points[i][1] * 3) * noiseAmt * H;

          const x1 = points[i + 1][0] * W;
          let y1 = points[i + 1][1] * H;
          if (noiseAmt > 0) y1 += simplex2(points[i + 1][0] * 8 + 0.5, points[i + 1][1] * 3) * noiseAmt * H;

          const dx = x1 - x0;
          const dy = y1 - y0;
          const len = Math.hypot(dx, dy) || 1;
          const nx = dy / len;
          const ny = -dx / len;

          const dot = nx * L.x + ny * L.y;
          const shade = ambient + (1 - ambient) * clamp(dot, 0, 1) * intensity;
          const alpha = (1 - shade) * 0.45;

          if (alpha > 0.005) {
            const topY = Math.min(y0, y1);
            const grad = ctx.createLinearGradient(0, topY, 0, topY + fadeH);
            grad.addColorStop(0, `rgba(10, 18, 24, ${alpha})`);
            grad.addColorStop(1, 'rgba(10, 18, 24, 0)');

            ctx.beginPath();
            ctx.moveTo(x0, y0);
            ctx.lineTo(x1, y1);
            ctx.lineTo(x1, y1 + fadeH);
            ctx.lineTo(x0, y0 + fadeH);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();
          }
        }
        ctx.restore();
      }

      /* ═══════════════════════════════════════════════════════════════════
         FIREFLIES (Mountain View Only — Summer, Monsoon, Autumn nights)
         ═══════════════════════════════════════════════════════════════════ */
      let _fireflyCanvas = null;
      function getFireflySprite() {
        if (!_fireflyCanvas) {
          _fireflyCanvas = document.createElement('canvas');
          _fireflyCanvas.width = 12;
          _fireflyCanvas.height = 12;
          const fctx = _fireflyCanvas.getContext('2d');
          const grad = fctx.createRadialGradient(6, 6, 0, 6, 6, 6);
          // Pre-rendered 12 px sprite: warm yellow-green #C8FF6A center to #E6FF9A, 1 px brighter core
          grad.addColorStop(0, '#FFFFFF'); // 1 px brighter core
          grad.addColorStop(0.18, '#C8FF6A');
          grad.addColorStop(0.60, 'rgba(230, 255, 154, 0.45)'); // #E6FF9A
          grad.addColorStop(1, 'rgba(230, 255, 154, 0)');
          fctx.fillStyle = grad;
          fctx.fillRect(0, 0, 12, 12);
        }
        return _fireflyCanvas;
      }

      const FIREFLIES = Array.from({ length: 40 }, (_, i) => ({
        // Pick 2 to 3 fireflies per home conifer
        treeIdx: Math.floor(((i * 0.6180339887) % 1) * CONIFER_TREES.length),
        // Two slow sine terms in X
        freqX1: 0.0007 + randSeed(i * 17 + 101) * 0.0005,
        freqX2: 0.0012 + randSeed(i * 19 + 203) * 0.0007,
        phaseX1: randSeed(i * 23 + 307) * TAU,
        phaseX2: randSeed(i * 29 + 409) * TAU,
        // Two slow sine terms in Y
        freqY1: 0.0008 + randSeed(i * 31 + 521) * 0.0005,
        freqY2: 0.0014 + randSeed(i * 37 + 613) * 0.0008,
        phaseY1: randSeed(i * 41 + 727) * TAU,
        phaseY2: randSeed(i * 43 + 839) * TAU,
        // Wanders within 5 to 8% of width
        rangeX: 0.05 + randSeed(i * 47 + 941) * 0.03,
        // Blinks on a 1.2-3 s cycle
        blinkPeriod: 1.2 + randSeed(i * 59 + 1163) * 1.8,
        blinkPhase: randSeed(i * 61 + 1277) * TAU,
        threshold: i / 40
      }));

      const FALLING_LEAVES = Array.from({ length: 16 }, (_, i) => ({
        seedX: randSeed(i * 31 + 101),
        seedY: randSeed(i * 37 + 203),
        speedY: 0.00008 + randSeed(i * 41 + 307) * 0.00006,
        swayFreq: 0.0015 + randSeed(i * 43 + 409) * 0.0012,
        swayPhase: randSeed(i * 47 + 521) * TAU,
        spinSpeed: 0.0018 + randSeed(i * 53 + 613) * 0.002,
        radiusX: 2.2 + randSeed(i * 59 + 719) * 1.6, // 3 to 5 px span
        radiusY: 1.2 + randSeed(i * 61 + 823) * 0.8,
        color: [
          [200, 150, 40], // gold
          [190, 100, 30], // orange
          [130, 80, 30]   // brown
        ][i % 3]
      }));

      let _fireflyDry = 0;
      let _fireflyLastTime = -1;
      let _fireflyDryHysteresis = 0;

      function drawFireflies(now, seasonInfo, cel, sWeights) {
        if (!cel || typeof cel.sunAlt === 'undefined') return;

        // Dry state with easing & hysteresis
        const dtSec = _fireflyLastTime < 0 ? 0.016 : clamp((now - _fireflyLastTime) * 0.001, 0, 0.1);
        const isInitFrame = _fireflyLastTime < 0;
        _fireflyLastTime = now;

        const isStormOrWind = weather.thunder || weather.cycloneActive || (weather.cycloneBlend && weather.cycloneBlend >= 0.05) || weather.wind >= 0.5;
        if (isStormOrWind) {
          _fireflyDryHysteresis = 0;
        } else {
          if (_fireflyDryHysteresis === 1) {
            if (weather.rain > 0.06) _fireflyDryHysteresis = 0;
          } else {
            if (weather.rain < 0.03) _fireflyDryHysteresis = 1;
          }
        }
        const dryTarget = _fireflyDryHysteresis;

        if (isInitFrame) {
          _fireflyDry = dryTarget;
        } else if (dtSec > 0) {
          const tau = (dryTarget > _fireflyDry) ? 10.0 : 2.5;
          _fireflyDry += (dryTarget - _fireflyDry) * (1 - Math.exp(-dtSec / tau));
        }
        _fireflyDry = clamp(_fireflyDry, 0, 1);

        if (_fireflyDry <= 0.0001) return;

        // Season factor
        if (!seasonInfo || !seasonInfo.season) seasonInfo = getSeasonInfo(simTime);
        if (!sWeights) {
          const t = smooth(seasonInfo.blend);
          sWeights = { WINTER: 0, SUMMER: 0, MONSOON: 0, AUTUMN: 0 };
          sWeights[seasonInfo.season] = 1 - t;
          sWeights[seasonInfo.nextSeason] = (sWeights[seasonInfo.nextSeason] || 0) + t;
        }

        const summerProg = (seasonInfo.season === 'SUMMER') ? seasonInfo.progress : 0;
        const autumnProg = (seasonInfo.season === 'AUTUMN') ? seasonInfo.progress : 0;
        const sfSummer = smoothstep(0.55, 0.85, summerProg);
        const sfAutumn = mix(0.7, 0.15, autumnProg);

        const seasonFactor = sWeights.WINTER * 0 +
          sWeights.SUMMER * sfSummer +
          sWeights.MONSOON * 1.0 +
          sWeights.AUTUMN * sfAutumn;

        if (seasonFactor <= 0.0001) return;

        const baseCount = (W < 900) ? 25 : 40;
        const activeCount = Math.ceil(baseCount * seasonFactor);

        // Night factor & activity
        const nightFactor = smoothstep(-3, -10, cel.sunAlt);
        const activity = nightFactor * _fireflyDry * seasonFactor;
        if (activity <= 0.0001) return;

        // In fog and mist multiply alpha by 0.8 and sprite scale by 1.3
        const inFogOrMist = weather.fog > 0.1;
        const fogAlpha = inFogOrMist ? 0.8 : 1.0;
        const spriteScale = inFogOrMist ? 1.3 : 1.0;

        const moonDim = 1 - 0.45 * (cel.illumFraction || 0) * smoothstep(-2, 10, cel.moonAlt || -10);
        const sprite = getFireflySprite();
        const speedMult = REDUCED ? 0.2 : 1.0;

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        for (let i = 0; i < activeCount; i++) {
          const f = FIREFLIES[i];
          const appear = smoothstep(f.threshold, f.threshold + 0.12, activity);
          if (appear <= 0.001) continue;

          // Blink on a 1.2 to 3 s cycle with soft envelope (~35% duty)
          const pulse = Math.sin(now * 0.001 * (TAU / f.blinkPeriod) + f.blinkPhase);
          const rawBlink = Math.max(0, (pulse - 0.40) / 0.60);
          const blinkEnv = smooth(rawBlink);
          if (blinkEnv <= 0.001) continue;

          const alpha = clamp(0.35 * fogAlpha * appear * blinkEnv * moonDim, 0, 0.35);
          if (alpha <= 0.002) continue;

          // Home conifer position
          const tree = CONIFER_TREES[f.treeIdx];
          const homeX = tree.x * W;
          const sX = Math.sin(now * f.freqX1 * speedMult + f.phaseX1) * 0.6 + Math.sin(now * f.freqX2 * speedMult + f.phaseX2) * 0.4;
          const sY = Math.sin(now * f.freqY1 * speedMult + f.phaseY1) * 0.6 + Math.sin(now * f.freqY2 * speedMult + f.phaseY2) * 0.4;

          const fx = homeX + sX * f.rangeX * W;
          const fy = tree.baseY * H - tree.height * H * (0.08 + 0.50 * (0.5 + 0.5 * sY));

          ctx.globalAlpha = alpha;
          const sW = 12 * spriteScale;
          const sH = 12 * spriteScale;
          ctx.drawImage(sprite, Math.round(fx - sW * 0.5), Math.round(fy - sH * 0.5), sW, sH);
        }

        ctx.restore();
      }

      function renderMountain(now, m, p, day, warm, golden, night, sunrise, sunset, alpha, slideX) {
        if (alpha <= 0) return;
        const horizonY = H * .77;
        const seasonInfo = getSeasonInfo(simTime);
        const sp = getSeasonParams(seasonInfo);

        ctx.save();
        if (slideX !== 0) ctx.translate(slideX, 0);
        if (alpha < 1) ctx.globalAlpha = alpha;

        // Apply weather tint to palette
        const wp = applyWeatherTint(p, weather);

        // Sky gradient
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, rgb(wp[0])); sky.addColorStop(.55, rgb(wp[1])); sky.addColorStop(1, rgb(wp[2]));
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

        // Celestials (Physical Sun & Moon for Western Ghats zone)
        const cel = drawCelestials(now, m, wp, day, warm, horizonY, ZONES.MOUNTAIN, false);

        // Consistent lighting calculation in screen space (y down)
        const sunIntensity = smoothstep(-2, 10, cel.sunAlt) * (1 - 0.8 * smoothstep(0.35, 0.95, weather.cloud));
        const moonIntensity = smoothstep(-2, 10, cel.moonAlt) * (1 - 0.8 * smoothstep(0.35, 0.95, weather.cloud)) * (0.15 * cel.illumFraction);

        const isNight = sunIntensity <= 0.001 && moonIntensity > 0.001;
        const lightX = isNight ? cel.moonX : cel.sunX;
        const lightAlt = isNight ? cel.moonAlt : cel.sunAlt;
        const intensity = isNight ? moonIntensity : sunIntensity;

        const Lx = clamp((lightX - W / 2) / (W / 2), -1, 1);
        const altRad = Math.max(0.04, lightAlt * PI / 180);
        const rawLx = Lx * Math.cos(altRad);
        const rawLy = -Math.sin(altRad);
        const Llen = Math.hypot(rawLx, rawLy) || 1;
        const L = { x: rawLx / Llen, y: rawLy / Llen };

        // Sunrise/sunset glows positioned at actual sun screen azimuth
        if (sunrise > 0.02) {
          const glowX = cel.sunX;
          const g = ctx.createRadialGradient(glowX, horizonY * .96, 0, glowX, horizonY * .96, Math.max(W, H) * .65);
          g.addColorStop(0, `rgba(242,198,160,${.28 * sunrise})`);
          g.addColorStop(.3, `rgba(228,169,154,${.14 * sunrise})`);
          g.addColorStop(1, 'rgba(228,169,154,0)');
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        }
        if (sunset > 0.02) {
          const glowX = cel.sunX;
          const g = ctx.createRadialGradient(glowX, horizonY * .96, 0, glowX, horizonY * .96, Math.max(W, H) * .70);
          g.addColorStop(0, `rgba(228,169,154,${.32 * sunset})`);
          g.addColorStop(.25, `rgba(200,140,148,${.18 * sunset})`);
          g.addColorStop(.55, `rgba(148,128,158,${.10 * sunset})`);
          g.addColorStop(1, 'rgba(120,100,130,0)');
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        }
        if (golden > 0.08) {
          const g = ctx.createLinearGradient(0, horizonY * .7, 0, H);
          g.addColorStop(0, 'rgba(242,198,160,0)');
          g.addColorStop(.6, `rgba(242,198,160,${.06 * golden})`);
          g.addColorStop(1, `rgba(242,198,160,${.09 * golden})`);
          ctx.fillStyle = g; ctx.fillRect(0, horizonY * .7, W, H);
        }

        // Physical Stars rotating with sky (~15°/hr drift)
        drawPhysicalStars(now, m, horizonY, ZONES.MOUNTAIN);

        // Clouds
        renderClouds(m, wp, sp, cel.sunX, cel.sunY, horizonY);
        drawClouds(horizonY, true);

        // Atmospheric haze
        drawHaze(wp, horizonY, sp);

        // ── LOW CLOUD & MIST PARAMETERS ──
        const tSeason = smooth(seasonInfo.blend);
        const sWeights = { WINTER: 0, SUMMER: 0, MONSOON: 0, AUTUMN: 0 };
        sWeights[seasonInfo.season] = 1 - tSeason;
        sWeights[seasonInfo.nextSeason] = (sWeights[seasonInfo.nextSeason] || 0) + tSeason;

        const monsoonWeight = sWeights.MONSOON;
        const winterWeight = sWeights.WINTER;

        const winterMorning = winterWeight * smoothstep(300, 360, m) * (1 - smoothstep(540, 600, m));
        const seasonBoost = Math.max(0.85 * monsoonWeight, 0.75 * winterMorning);
        const rainUp = smoothstep(0.15, 0.85, weather.rain);
        const lowCloudAlpha = clamp(0.10 + 0.28 * seasonBoost + 0.16 * weather.cloud + 0.30 * rainUp, 0.08, 0.80);
        const thickness = H * (0.05 + 0.04 * seasonBoost + 0.04 * rainUp);

        let lowCloudCol = lerpColor(wp[2], [255, 255, 255], 0.55);
        lowCloudCol = lerpColor(lowCloudCol, [150, 158, 166], rainUp * 0.6);
        lowCloudCol = lerpColor(lowCloudCol, [58, 64, 72], rainUp * weather.darkness);
        if (warm > 0.02) {
          lowCloudCol = lerpColor(lowCloudCol, [246, 210, 185], 0.25 * warm);
        }
        const nightDim = 1 - 0.85 * night;
        lowCloudCol = [
          clamp(lowCloudCol[0] * nightDim + night * 6, 0, 255),
          clamp(lowCloudCol[1] * nightDim + night * 10, 0, 255),
          clamp(lowCloudCol[2] * nightDim + night * 18, 0, 255)
        ];

        // ── FAR PALE RIDGES with atmospheric perspective ──
        const horizonCol = wp[2];
        const hazeCol = lerpColor(horizonCol, [215, 222, 225], 0.4);
        const hideFar = 0.25 * Math.max(weather.fog, rainUp);

        // Far ridge 1 - very pale, almost horizon color
        let far1Col = lerpColor(horizonCol, hazeCol, 0.15);
        if (hideFar > 0) far1Col = lerpColor(far1Col, horizonCol, hideFar);
        drawMountainShape(farRidge1, rgb(far1Col), null, 0.38, 0.008);

        // Mist between far ridges
        if (!_mistTexReady) buildMistTexture();
        {
          const mistAlpha = clamp(0.18 + 0.30 * weather.fog + 0.25 * rainUp + 0.12 * monsoonWeight, 0.15, 0.70);
          const mc = _mistCompCtx;
          mc.clearRect(0, 0, MIST_W, MIST_H);
          const mistScroll = (((now * 0.003 * (MIST_W / W)) % MIST_W) + MIST_W) % MIST_W;
          mc.drawImage(_mistTex, -mistScroll, 0, MIST_W, MIST_H);
          mc.drawImage(_mistTex, -mistScroll + MIST_W, 0, MIST_W, MIST_H);
          mc.globalCompositeOperation = 'source-in';
          mc.fillStyle = rgb(horizonCol);
          mc.fillRect(0, 0, MIST_W, MIST_H);
          mc.globalCompositeOperation = 'source-over';

          ctx.save();
          ctx.globalAlpha = mistAlpha;
          ctx.drawImage(_mistCompCanvas, 0, 0.58 * H, W, 0.20 * H);
          ctx.restore();
        }

        // Far ridge 2
        let far2Col = lerpColor(horizonCol, [120, 142, 135], 0.18);
        if (hideFar > 0) far2Col = lerpColor(far2Col, horizonCol, hideFar);
        drawMountainShape(farRidge2, rgb(far2Col), null, 0.55, 0.01);

        // ── LOW CLOUD BAND A (behind peak) ──
        {
          const driftPx = now * 0.006 * (1 + weather.wind);
          const thickA = H * (0.08 + 0.06 * seasonBoost + 0.06 * rainUp);
          const yBotA = 0.58 * H;
          drawLowCloudBand(yBotA, thickA, driftPx, 1.0, 0, W, false, lowCloudCol, lowCloudAlpha);

          // Under heavy rain (rainUp > 0.5) add a third drift pass of Band A, lowered so its bottom sits at about 0.60H
          if (rainUp > 0.5) {
            const heavyRainPassAlpha = smoothstep(0.5, 0.85, rainUp) * 0.75;
            drawLowCloudBand(0.60 * H, thickA * 0.85, driftPx + 480, heavyRainPassAlpha, 0, W, false, lowCloudCol, lowCloudAlpha);
          }
        }

        // ── MAIN PEAK ──
        // Season-dependent ground color (Monsoon hills are a darker, more vivid green than other seasons)
        let peakLit, peakShade;
        if (sp.season === 'MONSOON') {
          peakLit = [26, 102, 42]; // Darker, rich vivid emerald/moss green
          peakShade = [14, 52, 22];
        } else {
          const groundBase = sp.groundHue;
          peakLit = [Math.round(82 + groundBase[0] * 200), Math.round(95 + groundBase[1] * 140), Math.round(68 + groundBase[2] * 80)];
          peakShade = [Math.round(42 + groundBase[0] * 100), Math.round(58 + groundBase[1] * 80), Math.round(38 + groundBase[2] * 50)];
        }

        // Warm tint at golden hour
        if (warm > 0.05) {
          peakLit = lerpColor(peakLit, [205, 165, 110], warm * 0.25);
          peakShade = lerpColor(peakShade, [125, 85, 55], warm * 0.2);
        }
        // Night darkening
        if (night > 0.2) {
          peakLit = lerpColor(peakLit, [22, 32, 42], night * 0.72);
          peakShade = lerpColor(peakShade, [12, 18, 28], night * 0.78);
        }
        // Storm darkening
        if (weather.darkness > 0.1) {
          peakLit = lerpColor(peakLit, [45, 52, 48], weather.darkness * 0.4);
          peakShade = lerpColor(peakShade, [28, 32, 30], weather.darkness * 0.35);
        }

        // Draw main peak with shading driven by sun azimuth & altitude
        {
          drawMountainShape(mainPeakPoints, rgb(peakLit), null, 1, 0.012);
          drawSlopeLighting(mainPeakPoints, 0.012, L, intensity);

          // Forest texture streaks
          ctx.save();
          ctx.globalAlpha = 0.15;
          for (let i = 0; i < 30; i++) {
            const x = W * (0.12 + randSeed(i + 5000) * 0.76);
            const frac = x / W;
            let py = 0.78;
            for (let j = 0; j < mainPeakPoints.length - 1; j++) {
              if (frac >= mainPeakPoints[j][0] && frac < mainPeakPoints[j + 1][0]) {
                const lt = (frac - mainPeakPoints[j][0]) / (mainPeakPoints[j + 1][0] - mainPeakPoints[j][0]);
                py = mix(mainPeakPoints[j][1], mainPeakPoints[j + 1][1], lt);
                break;
              }
            }
            const yTop = py * H + randSeed(i + 5100) * H * 0.05;
            const yBot = yTop + H * (0.05 + randSeed(i + 5200) * 0.08);
            ctx.strokeStyle = rgb(peakShade, 0.3);
            ctx.lineWidth = 1 + randSeed(i + 5300) * 2;
            ctx.beginPath(); ctx.moveTo(x, yTop); ctx.lineTo(x + randSeed(i + 5400) * 6 - 3, yBot); ctx.stroke();
          }
          ctx.restore();

          // Mountain rim light from sun altitude/azimuth and moonlight
          const rimIntensity = warm * 0.45 * clamp(cel.sunFadeV + 0.1) + cel.moonlightFactor * 0.22;
          if (rimIntensity > 0.03) {
            ctx.save();
            ctx.beginPath();
            for (let i = 0; i < mainPeakPoints.length; i++) {
              const nx = mainPeakPoints[i][0] * W;
              let ny = mainPeakPoints[i][1] * H + simplex2(mainPeakPoints[i][0] * 8 + 0.5, mainPeakPoints[i][1] * 3) * 0.012 * H;
              if (i === 0) ctx.moveTo(nx, ny); else ctx.lineTo(nx, ny);
            }
            const rimCol = warm > 0.05 ? `rgba(242,198,160,${rimIntensity})` : `rgba(200,220,255,${rimIntensity})`;
            ctx.strokeStyle = rimCol;
            ctx.lineWidth = 2; ctx.stroke();
            ctx.restore();
          }
        }

        // ── SECOND RIDGE (darker, partially overlapping) ──
        {
          const r2Col = lerpColor(peakShade, [25, 35, 32], 0.3);
          drawMountainShape(secondRidgePoints, rgb(r2Col), null, 0.9, 0.015);
          drawSlopeLighting(secondRidgePoints, 0.015, L, intensity);
        }

        // ── LOW CLOUD BAND B (across the peak) ──
        {
          const driftPx = now * 0.006 * (1 + weather.wind);
          const yBotB = 0.64 * H;
          const xLeftB = 0.16 * W;
          const widthB = 0.68 * W;
          drawLowCloudBand(yBotB, thickness, driftPx + 240, 0.45, xLeftB, widthB, true, lowCloudCol, lowCloudAlpha);
        }

        // Summer afternoon subtle heat shimmer at the horizon
        if (sp.season === 'SUMMER' && m >= 720 && m <= 990 && weather.rain < 0.1 && weather.cloud < 0.45) {
          const shimmerFactor = Math.sin((m - 720) / 270 * PI) * (1 - weather.cloud);
          if (shimmerFactor > 0.04) {
            ctx.save();
            ctx.globalAlpha = shimmerFactor * 0.22;
            for (let s = 0; s < 3; s++) {
              const wave = Math.sin(now * 0.007 + s * 2.1) * 2.5;
              const sy = horizonY - 4 + s * 2.5 + wave;
              const sg = ctx.createLinearGradient(0, sy - 2, 0, sy + 3);
              sg.addColorStop(0, 'rgba(255,245,215,0)');
              sg.addColorStop(0.5, 'rgba(255,245,215,0.4)');
              sg.addColorStop(1, 'rgba(255,245,215,0)');
              ctx.fillStyle = sg;
              ctx.fillRect(0, sy - 2, W, 5);
            }
            ctx.restore();
          }
        }

        // Waterfalls (monsoon mountain view)
        drawWaterfalls(now, sp, night, intensity);

        // Layered conifer silhouettes with wind sway, seasonal foliage & grass
        {
          const sway = Math.sin(now * 0.002 + sp.windBase * 0.3) * (1 + weather.wind * 3.5);
          const sunOnLeft = Lx < 0;

          // Summer progress & pre-monsoon grass blend (last 30% of Summer)
          const summerProgress = (seasonInfo.season === 'SUMMER') ? seasonInfo.progress : 0;
          const summerGrassBlend = smoothstep(0.70, 1.0, summerProgress) * 0.50;
          const summerMid = lerpColor([120, 112, 56], [90, 130, 56], summerGrassBlend);
          const summerDark = lerpColor([84, 78, 42], [60, 92, 38], summerGrassBlend);

          let treeBase = [0, 0, 0];
          let grassMid = [0, 0, 0];
          let grassDark = [0, 0, 0];
          let flowers = 0;
          let leaves = 0;

          const LOOKS = {
            MONSOON: { conifer: [22, 66, 38], grassMid: [64, 108, 52], grassDark: [36, 72, 40], flowers: 0.6, leaves: 0 },
            AUTUMN: { conifer: [40, 70, 38], grassMid: [112, 120, 56], grassDark: [70, 82, 40], flowers: 0.35, leaves: 1.0 },
            WINTER: { conifer: [30, 56, 48], grassMid: [92, 100, 58], grassDark: [58, 68, 44], flowers: 0, leaves: 0 },
            SUMMER: { conifer: [48, 74, 40], grassMid: summerMid, grassDark: summerDark, flowers: 0, leaves: 0 }
          };

          for (const s of ['MONSOON', 'AUTUMN', 'WINTER', 'SUMMER']) {
            const w = sWeights[s];
            const l = LOOKS[s];
            treeBase[0] += l.conifer[0] * w;
            treeBase[1] += l.conifer[1] * w;
            treeBase[2] += l.conifer[2] * w;

            grassMid[0] += l.grassMid[0] * w;
            grassMid[1] += l.grassMid[1] * w;
            grassMid[2] += l.grassMid[2] * w;

            grassDark[0] += l.grassDark[0] * w;
            grassDark[1] += l.grassDark[1] * w;
            grassDark[2] += l.grassDark[2] * w;

            flowers += l.flowers * w;
            leaves += l.leaves * w;
          }

          // Wetness: wet = smoothstep(0.10, 0.70, weather.rain)
          const wet = smoothstep(0.10, 0.70, weather.rain);
          function applyWetness(c) {
            const dim = 1 - 0.22 * wet;
            let r = c[0] * dim;
            let g = c[1] * dim;
            let b = c[2] * dim;
            const avg = (r + g + b) / 3;
            const satPush = 0.06 * wet;
            return [
              r + (r - avg) * satPush,
              g + (g - avg) * satPush,
              b + (b - avg) * satPush
            ];
          }

          function clampTreeColor(c) {
            return [
              clamp(c[0], 10, 110),
              clamp(c[1], 22, 150),
              clamp(c[2], 14, 90)
            ];
          }

          treeBase = clampTreeColor(applyWetness(treeBase));
          grassMid = applyWetness(grassMid);
          grassDark = applyWetness(grassDark);

          const lightCol = warm > 0.05 ? [255, 215, 145] : [255, 245, 205];

          // Contact shadows at each tree base
          if (intensity > 0.01) {
            ctx.save();
            for (let i = 0; i < CONIFER_TREES.length; i++) {
              const tree = CONIFER_TREES[i];
              const tx = tree.x * W;
              const ty = tree.baseY * H;
              const th = tree.height * H;
              const tw = tree.width * W;
              const shadowDist = clamp((th * 0.8) / Math.tan(altRad), 0, th * 2);
              const shadowDir = Lx < 0 ? 1 : -1;
              const shadowX = tx + shadowDir * shadowDist * 0.5;
              const radiusX = shadowDist * 0.5 + tw * 0.35;
              const radiusY = tw * 0.22;

              const sGrad = ctx.createRadialGradient(shadowX, ty, 0, shadowX, ty, radiusX);
              sGrad.addColorStop(0, `rgba(6, 14, 10, ${0.28 * intensity})`);
              sGrad.addColorStop(0.5, `rgba(6, 14, 10, ${0.16 * intensity})`);
              sGrad.addColorStop(1, 'rgba(6, 14, 10, 0)');

              ctx.beginPath();
              ctx.ellipse(shadowX, ty, radiusX, radiusY, 0, 0, TAU);
              ctx.fillStyle = sGrad;
              ctx.fill();
            }
            ctx.restore();
          }

          // Split conifers (sun-facing half and ambient half) & grass clumps at bases
          for (let i = 0; i < CONIFER_TREES.length; i++) {
            const tree = CONIFER_TREES[i];
            const tx = tree.x * W;
            const ty = tree.baseY * H;
            const th = tree.height * H;
            const tw = tree.width * W;

            // Variation: brightness jitter +/- 6% and tiny hue jitter
            const bJitter = 1.0 + (randSeed(i * 13 + 701) * 0.12 - 0.06);
            const hJitter = (randSeed(i * 17 + 709) - 0.5) * 4.0;
            let tBase = [
              treeBase[0] * bJitter + hJitter,
              treeBase[1] * bJitter - hJitter * 0.5,
              treeBase[2] * bJitter - hJitter * 0.5
            ];

            // Trees fade into the haze in heavy rain, fog or winter morning
            const sizeFrac = clamp((tree.height - 0.11) / 0.08, 0, 1);
            const hazeMax = Math.max(winterMorning, weather.fog, rainUp);
            const mistFactor = mix(0.35, 0.12, sizeFrac) * hazeMax;
            if (mistFactor > 0.001) {
              tBase = lerpColor(tBase, horizonCol, mistFactor);
            }
            tBase = clampTreeColor(tBase);

            const treeCol = lerpColor(tBase, peakLit, 0.15);
            const treeNight = lerpColor(treeCol, [8, 16, 12], night * 0.72);
            const litTreeCol = clampTreeColor(lerpColor(treeNight, lightCol, 0.25 * intensity));
            const ambientTreeCol = clampTreeColor(lerpColor(treeNight, [12, 28, 18], 0.25));

            for (let t = 0; t < tree.tiers; t++) {
              const tierFrac = t / tree.tiers;
              const tierY = ty - th * tierFrac;
              const tierH = (th / tree.tiers) * 1.35;
              const tierW = tw * (1 - tierFrac * 0.45);
              const tipSway = sway * (tierFrac * 1.5 + 0.5);

              const apexX = tx + tipSway;
              const apexY = tierY - tierH;

              // Left half
              ctx.beginPath();
              ctx.moveTo(tx - tierW * 0.5, tierY);
              ctx.lineTo(apexX, apexY);
              ctx.lineTo(tx, tierY);
              ctx.closePath();
              ctx.fillStyle = rgb(sunOnLeft ? litTreeCol : ambientTreeCol);
              ctx.fill();

              // Right half
              ctx.beginPath();
              ctx.moveTo(tx, tierY);
              ctx.lineTo(apexX, apexY);
              ctx.lineTo(tx + tierW * 0.5, tierY);
              ctx.closePath();
              ctx.fillStyle = rgb(sunOnLeft ? ambientTreeCol : litTreeCol);
              ctx.fill();
            }

            // Grass clumps at tree base
            const gMidNight = lerpColor(grassMid, [8, 16, 12], night * 0.72);
            const gDarkNight = lerpColor(grassDark, [6, 12, 9], night * 0.72);
            const numBlades = 5;
            for (let b = 0; b < numBlades; b++) {
              const bFrac = (b - 2) / 2; // -1, -0.5, 0, 0.5, 1
              const bladeLen = (0.012 + randSeed(i * 11 + b * 7) * 0.007) * H;
              const bladeLean = bFrac * (tw * 0.5) + Math.sin(now * 0.002 + i) * 1.5;
              const tipX = tx + bladeLean;
              const tipY = ty - bladeLen;
              ctx.beginPath();
              ctx.moveTo(tx + bFrac * tw * 0.2, ty);
              ctx.quadraticCurveTo(tx + bladeLean * 0.4, ty - bladeLen * 0.6, tipX, tipY);
              ctx.strokeStyle = rgb(b % 2 === 0 ? gMidNight : gDarkNight);
              ctx.lineWidth = 1.2;
              ctx.stroke();

              // Wildflowers: on about 1 in 6 clumps at the tip of one blade (b === 2)
              if (i % 6 === 1 && b === 2 && flowers > 0.01) {
                const threshold = i / CONIFER_TREES.length;
                const flAlpha = smoothstep(threshold, threshold + 0.12, flowers);
                if (flAlpha > 0.01) {
                  const flCol = (i % 12 === 1) ? [232, 206, 96] : [226, 220, 240];
                  const flDim = flAlpha * (1 - 0.75 * night);
                  ctx.beginPath();
                  ctx.arc(tipX, tipY, 1.6, 0, TAU);
                  ctx.fillStyle = `rgba(${flCol[0]},${flCol[1]},${flCol[2]},${flDim})`;
                  ctx.fill();
                }
              }
            }
          }

          // Falling leaves (Autumn only)
          if (leaves > 0.001) {
            for (let i = 0; i < 16; i++) {
              const threshold = i / 16;
              const leafFade = smoothstep(threshold, threshold + 0.12, leaves) * (1 - weather.rain);
              if (leafFade <= 0.005) continue;

              const lf = FALLING_LEAVES[i];
              const prog = ((now * lf.speedY + lf.seedY) % 1.0);
              const yTop = 0.80 * H;
              const yBot = 0.98 * H;
              const curY = yTop + prog * (yBot - yTop);

              const sway = Math.sin(now * lf.swayFreq + lf.swayPhase) * (1 + weather.wind * 3.0) * 14;
              const curX = (lf.seedX * 0.92 + 0.04) * W + sway;
              const spin = now * lf.spinSpeed;

              ctx.save();
              ctx.translate(curX, curY);
              ctx.rotate(spin);
              ctx.beginPath();
              ctx.ellipse(0, 0, lf.radiusX, lf.radiusY, 0, 0, TAU);
              const c = lf.color;
              const nightDim = 1 - 0.72 * night;
              ctx.fillStyle = `rgba(${c[0] * nightDim | 0},${c[1] * nightDim | 0},${c[2] * nightDim | 0},${0.85 * leafFade})`;
              ctx.fill();
              ctx.restore();
            }
          }
        }

        // Fireflies (mountain view only)
        drawFireflies(now, seasonInfo, cel, sWeights);

        // Winter morning valley fog burns off by 09:00 (m = 540)
        if (sp.season === 'WINTER' && m >= 360 && m <= 540) {
          const fogBurn = 1 - (m - 360) / 180;
          if (fogBurn > 0.02) {
            ctx.save();
            ctx.globalAlpha = fogBurn * 0.35 * (1 - weather.rain);
            const fg = ctx.createLinearGradient(0, H * 0.75, 0, H);
            fg.addColorStop(0, 'rgba(230,235,245,0)');
            fg.addColorStop(0.6, 'rgba(230,235,245,0.7)');
            fg.addColorStop(1, 'rgba(230,235,245,0.9)');
            ctx.fillStyle = fg;
            ctx.fillRect(0, H * 0.75, W, H * 0.25);
            ctx.restore();
          }
        }

        // Weather effects on mountain view
        drawFog(horizonY, now);
        drawRain(horizonY, false);
        drawLightning();

        ctx.restore(); // end renderMountain
      }

      /* ═══════════════════════════════════════════════════════════════════
         GERSTNER WAVE PHYSICS (Calibrated with SEA_FETCH_FACTOR)
         ═══════════════════════════════════════════════════════════════════ */
      function buildGerstnerWaves(windSpeed, windDir) {
        const waves = [];
        const count = 8;
        const dominantT = clamp(0.85 * windSpeed, 5.0, 12.0); // dominant period
        // Hs = (0.21 * U^2 / g) * SEA_FETCH_FACTOR, capped at 12m
        const Hs = Math.min(12, (0.21 * windSpeed * windSpeed / g_) * SEA_FETCH_FACTOR);
        for (let i = 0; i < count; i++) {
          const frac = (i + 0.5) / count;
          const period = dominantT * (0.5 + frac * 1.2);
          const omega = TAU / period;
          const k = omega * omega / g_;
          const L = TAU / k;
          const c = g_ * period / (TAU);
          const amp = Hs / (count * 0.8) * (0.5 + frac * 1.0);
          // Direction spread ±30 degrees
          const dir = windDir + (-0.52 + frac * 1.04);
          waves.push({ amp: Math.min(amp, 3.0), k, omega, L, c, period, dir, phase: randSeed(i + 7000) * TAU });
        }
        return waves;
      }

      function getWaveHeight(x, t, gWaves) {
        let h = 0;
        for (const w of gWaves) {
          const theta = w.k * (x * Math.cos(w.dir)) - w.omega * t + w.phase;
          h += w.amp * Math.cos(theta);
          // Gerstner sharpening for steep waves
          const steepness = w.amp * w.k;
          if (steepness > 0.2) h += w.amp * 0.15 * Math.cos(theta * 2);
        }
        return h;
      }

      function getWaveSlope(x, t, gWaves) {
        let s = 0;
        for (const w of gWaves) {
