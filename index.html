          const u = (windSpeed - 22) / 8;
          wStrong = 0.75 * (1 - u);
          wCyclone = 0.80 * u;
        } else {
          wCyclone = 0.80;
        }

        if (weather.cycloneActive && windSpeed > 18) {
          const cFrac = clamp((windSpeed - 18) / 8);
          wCyclone = Math.max(wCyclone, 0.80 * cFrac);
          wStrong *= (1 - cFrac);
          wLight *= (1 - cFrac);
        }

        wLight *= windViewMult;
        wStrong *= windViewMult;
        wCyclone *= windViewMult;

        // Cyclone eye: wind drops to about 25%
        if (weather.cycloneInEye) {
          wLight *= 0.25;
          wStrong *= 0.25;
          wCyclone *= 0.25;
        }

        // ── 5. CRICKETS (Night, sun altitude < -6°, view-dependent, no winter) ──
        const m = minute % 1440;
        const cal = getCalendarDate(simTime);
        const curZone = vBlend < 0.5 ? ZONES.MOUNTAIN : ZONES.SHIP;
        const sunAstro = getSunAstronomical(m, cal.dayOfYear, curZone);
        const sunAlt = sunAstro.alt;
        const nightFactor = clamp((-sunAlt) / 6.0); // 0 at 0°, 1 at -6°

        const cricketSeasonFactor = sp.season === 'WINTER' ? 0 : 1;
        const cricketViewBase = mix(0.50, 0.15, vBlend);

        let cricketWeatherFactor = 1.0;
        if (weather.cycloneActive || weather.thunder || weather.rain > 0.50) {
          cricketWeatherFactor = 0;
        } else if (weather.rain > 0.05) {
          cricketWeatherFactor = mix(1.0, 0.30, clamp((weather.rain - 0.05) / 0.25));
        }

        const targetCrickets = cricketViewBase * nightFactor * cricketSeasonFactor * cricketWeatherFactor;

        // ── 6. APPLY SETTARGETATTIME (3s for rain, 1.5s for others) ──
        setLayerGain('rain-light', rLight, 3.0);
        setLayerGain('rain-steady', rSteady, 3.0);
        setLayerGain('rain-heavy', rHeavy, 3.0);
        setLayerGain('rain-cyclone', rCyclone, 3.0);

        setLayerGain('wind-light', wLight, 1.5);
        setLayerGain('wind-strong', wStrong, 1.5);
        setLayerGain('wind-cyclone', wCyclone, 1.5);

        setLayerGain('sea-calm', targetSeaCalm, 1.5);
        setLayerGain('sea-storm', targetSeaStorm, 1.5);

        setLayerGain('crickets-night', targetCrickets, 1.5);

        if (audioMode === 'html') {
          updateHtmlAudioVolumes();
        }

        // ── 7. AUDIO DEBUG TEXT OVERLAY (D key toggle) ──
        if (audioDebugEl && audioDebugVisible) {
          audioDebugEl.innerHTML = `
      <b>MODE: ${audioMode}</b><br>
      Files loaded: ${loadedCount} / 14<br>
      rain-light: ${getLayerLevel('rain-light').toFixed(2)} (tgt ${rLight.toFixed(2)})<br>
      rain-steady: ${getLayerLevel('rain-steady').toFixed(2)} (tgt ${rSteady.toFixed(2)})<br>
      rain-heavy: ${getLayerLevel('rain-heavy').toFixed(2)} (tgt ${rHeavy.toFixed(2)})<br>
      rain-cyclone: ${getLayerLevel('rain-cyclone').toFixed(2)} (tgt ${rCyclone.toFixed(2)})<br>
      wind-light: ${getLayerLevel('wind-light').toFixed(2)} (tgt ${wLight.toFixed(2)})<br>
      wind-strong: ${getLayerLevel('wind-strong').toFixed(2)} (tgt ${wStrong.toFixed(2)})<br>
      wind-cyclone: ${getLayerLevel('wind-cyclone').toFixed(2)} (tgt ${wCyclone.toFixed(2)})<br>
      sea-calm: ${getLayerLevel('sea-calm').toFixed(2)} (tgt ${targetSeaCalm.toFixed(2)})<br>
      sea-storm: ${getLayerLevel('sea-storm').toFixed(2)} (tgt ${targetSeaStorm.toFixed(2)})<br>
      crickets: ${getLayerLevel('crickets-night').toFixed(2)} (tgt ${targetCrickets.toFixed(2)})<br>
      master: ${getMasterLevel().toFixed(2)} (muted: ${isMuted})<br>
      rainFilter: ${rainFilter ? targetRainFreq.toFixed(0) + 'Hz' : 'N/A'} | thunder active: ${activeThunderCount}
    `;
        }
      }

      function triggerThunder(distKm) {
        if (weather.cycloneInEye) return;
        const dist = (typeof distKm === 'number' && distKm > 0) ? distKm : (0.5 + Math.random() * 11.5);
        if (audioMode === 'html') {
          playThunderOneShot(dist);
        } else {
          const delayMs = clamp(dist * 3000, 1000, 12000);
          setTimeout(() => {
            playThunderOneShot(dist);
          }, delayMs);
        }
      }

      function playThunderOneShot(distKm) {
        if (weather.cycloneInEye) return;
        if (activeThunderCount >= 2) return; // Allow at most 2 overlapping

        let file = 'thunder-close';
        if (distKm > 6) {
          file = 'thunder-far';
        } else if (distKm >= 2) {
          file = 'thunder-mid';
        }
        if ((distKm >= 4 || weather.cycloneActive) && Math.random() < 0.20) {
          file = 'thunder-deep';
        }

        const normDist = clamp((distKm - 0.5) / 11.5);
        const distGain = mix(0.9, 0.4, normDist); // Close 0.9, Far 0.4

        if (audioMode === 'webaudio') {
          if (!audioCtx || audioCtx.state === 'suspended') return;
          const buf = thunderBuffers[file];
          if (!buf) return;

          try {
            const src = audioCtx.createBufferSource();
            src.buffer = buf;
            src.playbackRate.value = 0.9 + Math.random() * 0.2; // 0.9 to 1.1

            const gainNode = audioCtx.createGain();
            gainNode.gain.value = distGain;

            if (audioCtx.createStereoPanner) {
              const panner = audioCtx.createStereoPanner();
              panner.pan.value = (Math.random() * 2 - 1) * 0.7; // random stereo pan
              src.connect(panner);
              panner.connect(gainNode);
            } else {
              src.connect(gainNode);
            }
            gainNode.connect(ambienceBus);

            activeThunderCount++;
            src.onended = () => {
              activeThunderCount = Math.max(0, activeThunderCount - 1);
            };
            src.start(0);
          } catch (e) {
            console.warn('Error playing thunder one-shot:', e);
          }
        } else {
          // HTML mode: preload cloned audio object for instant playback in sync with flash
          try {
            const base = htmlAudioElements[file];
            const a = base ? base.cloneNode() : new Audio('sounds/' + file + '.mp3');
            a.volume = clamp(distGain * masterLevel, 0, 1);
            a.playbackRate = 0.9 + Math.random() * 0.2;
            activeThunderCount++;
            const finish = () => {
              activeThunderCount = Math.max(0, activeThunderCount - 1);
              a.removeEventListener('ended', finish);
              a.removeEventListener('error', finish);
            };
            a.addEventListener('ended', finish);
            a.addEventListener('error', finish);
            const p = a.play();
            if (p && p.catch) {
              p.catch(() => {
                finish();
              });
            }
          } catch (e) {
            console.warn('Error playing thunder in HTML mode:', e);
          }
        }
      }

      function toggleAudioDebug() {
        audioDebugVisible = !audioDebugVisible;
        if (audioDebugEl) {
          audioDebugEl.style.display = audioDebugVisible ? 'block' : 'none';
        }
        if (audioDebugVisible) {
          updateAudioMix();
        }
      }

      /* ═══════════════════════════════════════════════════════════════════
         DEBUG HOTKEYS (?debug=1)
         ═══════════════════════════════════════════════════════════════════ */
      if (DEBUG) {
        console.log('[DEBUG] Debug mode active (?debug=1). Hotkeys: [W] cycle weather, [S] cycle season, [C] force cyclone, [N] advance moon, [D] audio debug');
        let debugSeasonIdx = getSeasonInfo(simTime).idx;
        addEventListener('keydown', e => {
          if (e.key === 'w' || e.key === 'W') {
            const season = getSeasonInfo(simTime).season;
            const allowed = WEATHER_ALLOWED[season];
            const curIdx = allowed.indexOf(weather.target);
            weather.target = allowed[(curIdx + 1) % allowed.length];
            weather.targetIntensity = 0.6 + Math.random() * 0.3;
            weather.nextChangeAt = simTime + 9999;
            console.log(`[DEBUG] Weather → ${weather.target} (${season}) | Intensity: ${weather.targetIntensity.toFixed(2)}`);
          }
          if (e.key === 's' || e.key === 'S') {
            debugSeasonIdx = (debugSeasonIdx + 1) % 4;
            simTime = debugSeasonIdx * SEASON_MINUTES + SEASON_MINUTES * 0.3;
            const si = getSeasonInfo(simTime);
            console.log(`[DEBUG] Season → ${si.season} (Day ${si.dayInSeason + 1}/${SEASON_DAYS}) | Weather: ${weather.current} | Intensity: ${weather.intensity.toFixed(2)}`);
          }
          if (e.key === 'c' || e.key === 'C') {
            if (weather.cycloneActive) {
              endCyclone();
            } else {
              startCyclone();
            }
          }
          if (e.key === 'n' || e.key === 'N') {
            _debugMoonDayOffset += 1;
            const curZone = currentView === 0 ? ZONES.MOUNTAIN : ZONES.SHIP;
            const cal = getCalendarDate(simTime);
            const mAstro = getMoonAstronomical(simTime, minute, cal.dayOfYear, curZone);
            console.log(`[DEBUG] Moon +1 Day → Age: ${mAstro.age.toFixed(1)}d | Phase: ${mAstro.phaseName} (${Math.round(mAstro.illumFraction * 100)}%)`);
          }
        });
        window.__debug = {
          render, frame, weather,
          setView: v => { currentView = v; viewBlend = v; },
          setMinute: m => { minute = m; },
          getMinute: () => minute,
          setSimTime: st => { simTime = st; },
          getSimTime: () => simTime,
          getCalendarDate,
          getSunAstronomical,
          getMoonAstronomical,
          projectBodyToScreen,
          drawCelestials,
          ZONES,
          SEASONS,
          getSeasonInfo,
          initAudioEngine,
          startAudio,
          updateAudioMix,
          triggerThunder,
          toggleMute,
          toggleAudioDebug,
          getAudioCtx: () => audioCtx,
          getLoopGains: () => loopGains,
          getAudioMode: () => audioMode,
          getLayerLevel,
          getLoadedCount: () => loadedCount,
          getMasterLevel,
          htmlAudioElements,
          testWeather: (seed = 1, realSeconds = 1800, targetSeason = null) => {
            const savedState = {
              simTime,
              weather: Object.assign({}, weather),
              lastSeason: _lastSeasonTracked,
              weatherRng: _weatherRng
            };

            const seasonsToRun = targetSeason ? [targetSeason] : ['WINTER', 'SUMMER', 'MONSOON', 'AUTUMN'];
            const allResults = {};

            for (const sName of seasonsToRun) {
              _weatherRng = seed >>> 0;
              const sIdx = SEASONS.indexOf(sName);
              let simT = sIdx * SEASON_MINUTES + SEASON_MINUTES * 0.2;
              let minuteOfDay = 360;

              const startType = (sName === 'MONSOON') ? 'heavyRain' : (WEATHER_ALLOWED[sName][0] || 'clear');
              weather.current = startType;
              weather.target = startType;
              weather.prevTarget = startType;
              weather.intensity = (startType === 'heavyRain' || startType === 'steadyRain' || startType === 'drizzle' || startType === 'thunderstorm') ? 0.85 : 0.7;
              weather.targetIntensity = weather.intensity;
              const tw0 = WEATHER_TYPES[startType] || WEATHER_TYPES.clear;
              weather.cloud = tw0.cloud;
              weather.rain = tw0.rain;
              weather.fog = tw0.fog;
              weather.wind = tw0.wind;
              weather.darkness = tw0.darkness;
              weather.thunder = tw0.thunder;
              weather.durationRemaining = getDurationForWeather(startType, sName);
              weather.transitionElapsed = 20;
              _lastSeasonTracked = sName;

              const sequence = [startType];
              let maxRainPerSec = 0;
              let maxCloudPerSec = 0;
              const forbiddenJumps = [];
              let monsoonWetSteps = 0;
              let monsoonTotalSteps = 0;
              let clearInMonsoonCount = 0;

              const dtMs = 100;
              const dtSec = 0.1;
              const steps = Math.round(realSeconds / dtSec);

              let lastTarget = weather.target;

              for (let step = 0; step < steps; step++) {
                simT += dtSec * (1440 / DAY_SECONDS);
                minuteOfDay = Math.floor(simT) % 1440;

                const seasonInfo = {
                  season: sName,
                  nextSeason: SEASONS[(sIdx + 1) % 4],
                  progress: (step / steps),
                  blend: (step / steps > 0.90) ? ((step / steps - 0.90) / 0.10) : 0,
                  idx: sIdx,
                  nextIdx: (sIdx + 1) % 4,
                  dayInSeason: Math.floor((step / steps) * SEASON_DAYS)
                };

                const preRain = weather.rain;
                const preCloud = weather.cloud;

                updateWeather(dtMs, minuteOfDay, seasonInfo);

                const dRain = Math.abs(weather.rain - preRain) / dtSec;
                const dCloud = Math.abs(weather.cloud - preCloud) / dtSec;
                if (dRain > maxRainPerSec) maxRainPerSec = dRain;
                if (dCloud > maxCloudPerSec) maxCloudPerSec = dCloud;

                if (weather.target !== lastTarget) {
                  if (weather.target === lastTarget) {
                    forbiddenJumps.push(`Repeat: ${lastTarget} -> ${weather.target}`);
                  }
                  if ((lastTarget === 'heavyRain' || lastTarget === 'thunderstorm') && weather.target === 'clear') {
                    forbiddenJumps.push(`Forbidden jump: ${lastTarget} -> clear`);
                  }
                  sequence.push(weather.target);
                  lastTarget = weather.target;
                }

                if (sName === 'MONSOON') {
                  monsoonTotalSteps++;
                  const isWet = (weather.target === 'drizzle' || weather.target === 'steadyRain' || weather.target === 'heavyRain' || weather.target === 'thunderstorm' || weather.rain > 0.08);
                  if (isWet) monsoonWetSteps++;

                  const activeType = weather.current || weather.target;
                  const WEATHER_NAME_MAP = {
                    clear: 'CLEAR', clearing: 'CLEARING', haze: 'HAZE', lightCloud: 'LIGHT CLOUD',
                    morningFog: 'FOG', drizzle: 'DRIZZLE', steadyRain: 'RAIN', heavyRain: 'HEAVY RAIN', thunderstorm: 'THUNDERSTORM'
                  };
                  let weatherName = WEATHER_NAME_MAP[activeType] || 'CLEAR';
                  if (weatherName === 'CLEAR') {
                    clearInMonsoonCount++;
                  }
                }
              }

              const wetPercent = monsoonTotalSteps > 0 ? (monsoonWetSteps / monsoonTotalSteps * 100) : 0;
              allResults[sName] = {
                season: sName,
                seed,
                realSeconds,
                sequenceLength: sequence.length,
                sequence: sequence.join(' -> '),
                maxRainChangePerSec: parseFloat(maxRainPerSec.toFixed(4)),
                maxCloudChangePerSec: parseFloat(maxCloudPerSec.toFixed(4)),
                monsoonWetPercent: monsoonTotalSteps > 0 ? parseFloat(wetPercent.toFixed(1)) : 'N/A',
                forbiddenJumpsCount: forbiddenJumps.length,
                forbiddenJumps,
                clearLabelInMonsoonCount: clearInMonsoonCount
              };
            }

            // Restore saved state
            simTime = savedState.simTime;
            Object.assign(weather, savedState.weather);
            _lastSeasonTracked = savedState.lastSeason;
            _weatherRng = savedState.weatherRng;

            console.log(`[WEATHER TEST] Seed ${seed} over ${realSeconds}s:`, allResults);
            return allResults;
          }
        };
      }

      /* ═══════════════════════════════════════════════════════════════════
         AMBIENCE & MUTE CONTROL (Web Audio master chain)
         ═══════════════════════════════════════════════════════════════════ */
      const btnSound = document.getElementById('btnSound');

      let hasStarted = false;

      function updateSoundButtonUI() {
        btnSound.classList.toggle('is-muted', isMuted);
        btnSound.setAttribute('aria-label', isMuted ? 'Unmute sound' : 'Mute sound');
        btnSound.setAttribute('aria-pressed', String(isMuted));
      }
      updateSoundButtonUI();

      function startAudio() {
        initAudioEngine();
      }

      function toggleMute() {
        initAudioEngine();
        isMuted = !isMuted;
        try { localStorage.setItem('celestial_muted', isMuted ? 'true' : 'false'); } catch (e) { }
        updateSoundButtonUI();

        if (audioMode === 'webaudio') {
          if (masterGainNode && audioCtx) {
            // 0.4 s ramp (setTargetAtTime with tau ~ 0.133 s)
            masterGainNode.gain.setTargetAtTime(isMuted ? 0 : 1, audioCtx.currentTime, 0.133);
          }
        }

        if (!isMuted) {
          if (audioMode === 'html') {
            playHtmlLoops().then(allSuccess => {
              if (allSuccess) {
                hasStarted = true;
                removeInteractionListeners();
              }
            });
          } else {
            hasStarted = true;
            removeInteractionListeners();
          }
        }
      }

      const INTERACTION_EVENTS = ['pointerdown', 'keydown', 'touchstart'];
      function onFirstInteraction(e) {
        if (e && e.target && (e.target === btnSound || btnSound.contains(e.target))) return;
        if (e && (e.key === 'm' || e.key === 'M')) return;
        initAudioEngine();
        if (!hasStarted && !isMuted) {
          if (audioMode === 'html') {
            playHtmlLoops().then(allSuccess => {
              if (allSuccess) {
                hasStarted = true;
                removeInteractionListeners();
              }
            });
          } else {
            hasStarted = true;
            removeInteractionListeners();
          }
        }
      }

      function addInteractionListeners() {
        INTERACTION_EVENTS.forEach(evt => { window.addEventListener(evt, onFirstInteraction, { passive: true }); });
      }

      function removeInteractionListeners() {
        INTERACTION_EVENTS.forEach(evt => { window.removeEventListener(evt, onFirstInteraction); });
      }

      btnSound.addEventListener('click', toggleMute);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (audioMode === 'webaudio') {
            if (audioCtx && audioCtx.state === 'running') {
              audioCtx.suspend();
            }
          } else {
            for (const name of LOOP_NAMES) {
              const a = htmlAudioElements[name];
              if (a && !a.paused) {
                a.pause();
              }
            }
          }
        } else {
          if (audioMode === 'webaudio') {
            if (audioCtx && audioCtx.state === 'suspended' && !isMuted) {
              audioCtx.resume();
            }
          } else {
            if (!isMuted && hasStarted) {
              playHtmlLoops();
            }
          }
        }
      });

      addEventListener('keydown', e => {
        if ((e.key === 'm' || e.key === 'M') && !e.altKey && !e.ctrlKey && !e.metaKey) {
          toggleMute();
        }
        if ((e.key === 'd' || e.key === 'D') && !e.altKey && !e.ctrlKey && !e.metaKey) {
          toggleAudioDebug();
        }
      });

      if (audioMode === 'html') {
        initHtmlAudioElements();
      }

      if (!isMuted) {
        addInteractionListeners();
      }

      // Live audio mixing update loop (10 times per second)
      setInterval(updateAudioMix, 100);

      /* ─── initial state ────────────────────────────────────────────── */
      setButtonStates();
      requestAnimationFrame(frame);

    })();
  </script>
