          const theta = w.k * (x * Math.cos(w.dir)) - w.omega * t + w.phase;
          s -= w.amp * w.k * Math.sin(theta) * Math.cos(w.dir);
        }
        return s;
      }

      /* ═══════════════════════════════════════════════════════════════════
         5) SHIP VIEW — Bay of Bengal cruise liner
         ═══════════════════════════════════════════════════════════════════ */
      let _shipHeave = 0, _shipRoll = 0, _shipPitch = 0;
      let _slamTimer = 0, _slamDrop = 0, _nextSlamIn = 4.0;
      const _sprayParticles = [];

      function renderShip(now, m, p, day, warm, golden, night, sunrise, sunset, alpha, slideX) {
        if (alpha <= 0) return;
        const t = now * 0.001;
        const motionScale = REDUCED ? 0.05 : 1;
        const seasonInfo = getSeasonInfo(simTime);
        const sp = getSeasonParams(seasonInfo);

        // Apply weather tint
        const wp = applyWeatherTint(p, weather);

        // ── SEA STATE PHYSICS ──
        // Hs = (0.21 * U^2 / g) * SEA_FETCH_FACTOR, capped at 12 m
        // Calibrated base winds: Winter 0.3-1m, Summer 1-2m, Monsoon 3-6m, strong storm 6-9m, cyclone peak 9-12m
        const weatherWindBonus = weather.cycloneActive
          ? 0
          : (weather.wind * (sp.season === 'MONSOON' ? 4.8 : (weather.thunder ? 6.2 : 2.8)));
        const windSpeed = weather.cycloneActive
          ? weather.cycloneWindSpeed
          : (sp.windBase + weatherWindBonus);
        const gWaves = buildGerstnerWaves(windSpeed, 0.2);
        const rawHs = (0.21 * windSpeed * windSpeed / g_) * SEA_FETCH_FACTOR;
        const effectiveHs = (weather.cycloneActive && weather.cycloneSwell)
          ? Math.max(rawHs, (0.21 * weather.cycloneSwell * weather.cycloneSwell / g_) * SEA_FETCH_FACTOR)
          : rawHs;
        const clampedHs = Math.min(12, effectiveHs);

        // ── SHIP MOTION AND SHAKE (Natural periods without artificial slowdowns) ──
        const dominantT = clamp(0.85 * windSpeed, 5.0, 12.0); // 5 to 12 s
        const omegaH = TAU / dominantT;          // heave period ~ T
        const omegaR = TAU / (1.2 * dominantT);  // roll period ~ 1.2*T
        const omegaP = TAU / (0.8 * dominantT);  // pitch period ~ 0.8*T

        // 2-3 non-harmonic synthesis terms per axis
        const hRaw = Math.sin(t * omegaH) * 0.65 +
          Math.sin(t * omegaH * 1.39 + 1.2) * 0.25 +
          Math.sin(t * omegaH * 0.73 + 2.8) * 0.10;

        const rRaw = Math.sin(t * omegaR + 0.5) * 0.62 +
          Math.sin(t * omegaR * 1.31 + 2.0) * 0.26 +
          Math.sin(t * omegaR * 0.78 + 3.9) * 0.12;

        const pRaw = Math.sin(t * omegaP + 1.1) * 0.64 +
          Math.sin(t * omegaP * 1.37 + 0.9) * 0.24 +
          Math.sin(t * omegaP * 0.71 + 2.1) * 0.12;

        // Amplitude scaling:
        // Calm: heave 3-6 px, roll 0.4 deg, pitch 0.2 deg
        // Rough: heave 15-30 px, roll 2-4 deg, pitch 1-3 deg
        // Cyclone: heave 40-80 px, roll 6-12 deg, pitch 3-6 deg
        const seaNorm = clamp(clampedHs / 11.0);
        let targetHeaveAmp = (seaNorm <= 0.45)
          ? mix(4.2, 22.0, seaNorm / 0.45)
          : mix(22.0, 62.0, (seaNorm - 0.45) / 0.55);

        let targetRollAmpDeg = (seaNorm <= 0.45)
          ? mix(0.40, 3.2, seaNorm / 0.45)
          : mix(3.2, 9.8, (seaNorm - 0.45) / 0.55);

        let targetPitchAmpDeg = (seaNorm <= 0.45)
          ? mix(0.20, 2.0, seaNorm / 0.45)
          : mix(2.0, 4.8, (seaNorm - 0.45) / 0.55);

        // Sudden lurches when large wave arrives
        let lurchRoll = 0, lurchHeave = 0;
        if (clampedHs > 3.0 && !REDUCED) {
          const lurchWave = Math.sin(t * omegaR * 0.35 + Math.sin(t * 0.25));
          if (lurchWave > 0.88) {
            const lurchFrac = (lurchWave - 0.88) / 0.12;
            lurchRoll = (lurchFrac * lurchFrac) * mix(0.02, 0.07, clamp((clampedHs - 3) / 7));
            lurchHeave = lurchFrac * mix(6, 18, clamp((clampedHs - 3) / 7));
          }
        }

        const targetHeave = (hRaw * targetHeaveAmp + lurchHeave) * motionScale;
        const targetRoll = (rRaw * (targetRollAmpDeg * PI / 180) + lurchRoll) * motionScale;
        const targetPitch = (pRaw * (targetPitchAmpDeg * PI / 180)) * motionScale;

        // Low-pass the motion so the ship feels heavy
        const lagFactor = 0.12;
        _shipHeave += (targetHeave - _shipHeave) * lagFactor;
        _shipRoll += (targetRoll - _shipRoll) * lagFactor;
        _shipPitch += (targetPitch - _shipPitch) * lagFactor;

        const heave = _shipHeave;
        const roll = _shipRoll;
        const pitch = _shipPitch;

        // Camera shake: high-frequency tremble scaled by wind (up to 4 px, more in a cyclone)
        let shakeX = 0, shakeY = 0;
        if (windSpeed > 10 && !REDUCED) {
          const trembleMax = weather.cycloneActive ? 6.5 : 4.0;
          const trembleAmt = clamp((windSpeed - 10) / 22) * trembleMax;
          shakeX = (Math.sin(now * 0.052) + Math.sin(now * 0.087) * 0.5) * trembleAmt;
          shakeY = (Math.cos(now * 0.048) + Math.sin(now * 0.074) * 0.5) * trembleAmt;
        }

        // Quick slams (10-20 px drop recovering in 0.4 s) with spray burst
        let slamY = 0;
        if (clampedHs > 3.0 && !REDUCED) {
          _nextSlamIn -= 0.016;
          if (_nextSlamIn <= 0 && _slamTimer <= 0) {
            _slamTimer = 0.4; // 0.4s recovery
            _slamDrop = mix(10, 20, clamp((clampedHs - 3) / 8));
            _nextSlamIn = 4.0 + visualRandom() * 6.0;
            // Trigger spray burst
            const burstCount = Math.floor(mix(18, 38, clamp((clampedHs - 3) / 8)));
            for (let k = 0; k < burstCount; k++) {
              _sprayParticles.push({
                x: W * 0.08 + visualRandom() * W * 0.45,
                y: H * 0.58 + visualRandom() * 40,
                vx: (visualRandom() - 0.25) * 8 + weather.wind * 6,
                vy: -6 - visualRandom() * 9,
                r: 1.2 + visualRandom() * 2.5,
                life: 0.85 + visualRandom() * 0.45
              });
            }
          }
          if (_slamTimer > 0) {
            _slamTimer -= 0.016;
            const slamProgress = 1.0 - clamp(_slamTimer / 0.4);
            slamY = Math.sin(slamProgress * PI) * _slamDrop * motionScale;
          }
        }

        const bobY = heave + slamY + shakeY;
        const horizonY = H * 0.58 + bobY;
        const vpX = W * 0.62 + shakeX;
        const vpY = horizonY;

        ctx.save();
        if (slideX !== 0) ctx.translate(slideX, 0);
        if (alpha < 1) ctx.globalAlpha = alpha;

        // Tilt the sky/sun/moon/clouds/ocean with roll so whole view feels attached to ship
        ctx.save();
        ctx.translate(vpX, horizonY);
        ctx.rotate(roll);
        ctx.translate(-vpX, -horizonY);

        /* ── 1. Sky ── */
        {
          const sky = ctx.createLinearGradient(0, -H * 0.25, 0, horizonY);
          sky.addColorStop(0, rgb(wp[0])); sky.addColorStop(0.55, rgb(wp[1])); sky.addColorStop(1, rgb(wp[2]));
          ctx.fillStyle = sky;
          ctx.fillRect(-W * 0.25, -H * 0.25, W * 1.5, horizonY + H * 0.25 + 4);
        }

        /* ── 2. Celestials (Physical Sun & Moon for Bay of Bengal zone) ─── */
        const cel = drawCelestials(now, m, wp, day, warm, horizonY, ZONES.SHIP, true);

        // Sunrise/sunset glows positioned at actual sun screen azimuth
        if (sunrise > 0.02) {
          const glowX = cel.sunX;
          const g = ctx.createRadialGradient(glowX, horizonY, 0, glowX, horizonY, Math.max(W, H) * .72);
          g.addColorStop(0, `rgba(242,198,160,${0.32 * sunrise})`);
          g.addColorStop(0.3, `rgba(228,169,154,${0.15 * sunrise})`);
          g.addColorStop(1, 'rgba(228,169,154,0)');
          ctx.fillStyle = g; ctx.fillRect(-W * 0.25, 0, W * 1.5, horizonY);
        }
        if (sunset > 0.02) {
          const glowX = cel.sunX;
          const g = ctx.createRadialGradient(glowX, horizonY, 0, glowX, horizonY, Math.max(W, H) * .74);
          g.addColorStop(0, `rgba(228,169,154,${0.35 * sunset})`);
          g.addColorStop(0.25, `rgba(200,140,148,${0.18 * sunset})`);
          g.addColorStop(0.55, `rgba(148,128,158,${0.10 * sunset})`);
          g.addColorStop(1, 'rgba(120,100,130,0)');
          ctx.fillStyle = g; ctx.fillRect(-W * 0.25, 0, W * 1.5, horizonY);
        }
        if (golden > 0.08) {
          const g = ctx.createLinearGradient(0, horizonY * 0.6, 0, horizonY);
          g.addColorStop(0, 'rgba(242,198,160,0)');
          g.addColorStop(1, `rgba(242,198,160,${0.10 * golden})`);
          ctx.fillStyle = g; ctx.fillRect(-W * 0.25, horizonY * 0.6, W * 1.5, horizonY * 0.4 + 2);
        }

        /* ── 3. Physical Stars rotating with sky (~15°/hr drift) ────────── */
        drawPhysicalStars(now, m, horizonY, ZONES.SHIP);

        /* ── Clouds ─────────────────────────────────────────────────────── */
        renderClouds(m, wp, sp, cel.sunX, cel.sunY, horizonY);
        drawClouds(horizonY, false);

        // Summer afternoon subtle heat shimmer along the horizon band
        if (sp.season === 'SUMMER' && m >= 720 && m <= 990 && weather.rain < 0.1 && weather.cloud < 0.45) {
          const shimmerFactor = Math.sin((m - 720) / 270 * PI) * (1 - weather.cloud);
          if (shimmerFactor > 0.04) {
            ctx.save();
            ctx.globalAlpha = shimmerFactor * 0.24;
            for (let s = 0; s < 3; s++) {
              const wave = Math.sin(now * 0.007 + s * 2.1) * 2.5;
              const sy = horizonY - 3 + s * 2.5 + wave;
              const sg = ctx.createLinearGradient(0, sy - 2, 0, sy + 3);
              sg.addColorStop(0, 'rgba(255,245,215,0)');
              sg.addColorStop(0.5, 'rgba(255,245,215,0.4)');
              sg.addColorStop(1, 'rgba(255,245,215,0)');
              ctx.fillStyle = sg;
              ctx.fillRect(-W * 0.25, sy - 2, W * 1.5, 5);
            }
            ctx.restore();
          }
        }

        /* ── 4. Ocean with Gerstner waves ───────────────────────────────── */
        // Coastline silhouette
        {
          ctx.save(); ctx.beginPath(); ctx.moveTo(-W * 0.1, horizonY);
          const coast = [[0, 0], [0.04, -6], [0.09, -14], [0.15, -8], [0.21, -16], [0.27, -10], [0.34, -15], [0.41, -6], [0.47, -10], [0.53, 0]];
          for (let i = 0; i < coast.length; i++) ctx.lineTo(coast[i][0] * W, horizonY + coast[i][1]);
          ctx.lineTo(0.53 * W, horizonY); ctx.closePath();
          const coastCol = lerpColor(wp[2], [36, 56, 72], 0.4);
          const coastNight = lerpColor(coastCol, [15, 24, 38], night * 0.45);
          ctx.fillStyle = rgb(coastNight, 0.4 * (1 - weather.fog * 0.5)); ctx.fill();
          ctx.restore();
        }

        // Horizon haze
        {
          const hazeCol = lerpColor(wp[2], [240, 238, 232], warm * 0.3);
          const hg = ctx.createLinearGradient(0, horizonY - 14, 0, horizonY + 18);
          hg.addColorStop(0, 'rgba(0,0,0,0)');
          hg.addColorStop(0.46, rgb(hazeCol, 0.25 + 0.20 * golden));
          hg.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = hg; ctx.fillRect(-W * 0.25, horizonY - 14, W * 1.5, 32);
        }

        // Water colors - season and weather dependent
        let deepWater = [11, 62, 108];
        let shallowWater = [38, 98, 142];

        if (weather.rain > 0.2 || sp.season === 'MONSOON') {
          const stormMix = Math.max(weather.rain, sp.season === 'MONSOON' ? 0.3 : 0);
          deepWater = lerpColor(deepWater, [32, 52, 48], stormMix * 0.5);
          shallowWater = lerpColor(shallowWater, [65, 82, 72], stormMix * 0.4);
        }
        if (sp.season === 'WINTER' || sp.temp === 'cool') {
          deepWater = lerpColor(deepWater, [8, 48, 95], 0.2);
        }

        let reflTint = [0, 0, 0];
        if (sunrise > 0.04) reflTint = lerpColor(reflTint, [242, 148, 82], sunrise * 0.6);
        if (sunset > 0.04) reflTint = lerpColor(reflTint, [218, 108, 62], sunset * 0.65);
        const warmOcean = Math.max(sunrise, sunset);
        const shallowTinted = lerpColor(shallowWater, reflTint, warmOcean * 0.5);

        if (night > 0.2) {
          deepWater = lerpColor(deepWater, [6, 18, 35], night * 0.7);
          shallowWater = lerpColor(shallowWater, [10, 28, 48], night * 0.65);
        }

        // Base ocean fill
        const waterBase = ctx.createLinearGradient(0, horizonY, 0, H * 1.2);
        waterBase.addColorStop(0, rgb(shallowTinted));
        waterBase.addColorStop(0.35, rgb(lerpColor(shallowWater, deepWater, 0.45)));
        waterBase.addColorStop(1, rgb(deepWater));
        ctx.fillStyle = waterBase; ctx.fillRect(-W * 0.25, horizonY, W * 1.5, H * 1.2 - horizonY);

        // Draw wave rows with Gerstner physics
        const bandH = H - horizonY;
        const WAVE_ROWS = 18;
        const STEPS = Math.max(36, Math.ceil(W / 24));

        for (let bi = 0; bi < WAVE_ROWS; bi++) {
          const nd = bi / (WAVE_ROWS - 1);
          const nd2 = nd * nd;
          const nd3 = nd2 * nd;
          const y = horizonY + bandH * smooth5(nd);
          const prevY = bi === 0 ? horizonY : horizonY + bandH * smooth5((bi - 1) / (WAVE_ROWS - 1));

          // Scale amplitude by perspective and sea state
          const perspAmp = 0.8 + nd3 * clampedHs * 2.8;

          const wavePoints = [];
          for (let xi = -2; xi <= STEPS + 2; xi++) {
            const xp = (xi / STEPS) * W;
            const waveH = getWaveHeight(xp * 0.01 + nd * 10, t * 0.5, gWaves) * perspAmp * (REDUCED ? 0.15 : 1);
            const wy = y + waveH;
            wavePoints.push(xp, wy);
          }

          // Wave band color
          const bandAlpha = 0.06 + nd2 * 0.6;
          let bCol = bi % 2 === 0 ?
            lerpColor(deepWater, shallowTinted, nd * 0.3) :
            lerpColor(shallowTinted, [Math.min(255, shallowTinted[0] + 18), Math.min(255, shallowTinted[1] + 22), Math.min(255, shallowTinted[2] + 28)], nd * 0.4);

          // Cyclone visibility: apply exponential distance fog per wave row by depth
          if (weather.cycloneActive && weather.cycloneWindSpeed > 16) {
            const visMeters = mix(150, 50, clamp((weather.cycloneWindSpeed - 16) / 16));
            const depthDist = mix(2500, 30, Math.pow(nd, 0.72));
            const rowFogA = 1 - Math.exp(-depthDist / visMeters);
            bCol = lerpColor(bCol, [122, 128, 134], rowFogA);
          }

          const grad = ctx.createLinearGradient(0, prevY, 0, y + perspAmp * 2);
          grad.addColorStop(0, rgb(bCol, 0));
          grad.addColorStop(0.4, rgb(bCol, bandAlpha * 0.5));
          grad.addColorStop(1, rgb(bCol, bandAlpha));

          ctx.beginPath(); ctx.moveTo(wavePoints[0], wavePoints[1]);
          for (let xi = 0; xi < wavePoints.length; xi += 2) ctx.lineTo(wavePoints[xi], wavePoints[xi + 1]);
          ctx.lineTo(W * 1.25, prevY); ctx.lineTo(-W * 0.25, prevY); ctx.closePath();
          ctx.fillStyle = grad; ctx.fill();

          // Crest highlights
          if (nd > 0.12) {
            const cAlpha = clamp(nd2 * 0.5);
            ctx.beginPath(); ctx.moveTo(wavePoints[0], wavePoints[1]);
            for (let xi = 2; xi < wavePoints.length; xi += 2) ctx.lineTo(wavePoints[xi], wavePoints[xi + 1]);
            ctx.strokeStyle = `rgba(${Math.min(255, bCol[0] + 30) | 0},${Math.min(255, bCol[1] + 35) | 0},${Math.min(255, bCol[2] + 42) | 0},${cAlpha})`;
            ctx.lineWidth = 0.6 + nd * 1.2; ctx.stroke();
          }

          // Whitecaps when steep
          if (nd > 0.3 && clampedHs > 1.5 && !REDUCED) {
            const slopeThreshold = 0.05 * Math.min(6, clampedHs);
            for (let xi = 0; xi < wavePoints.length - 2; xi += 2) {
              const slope = Math.abs(wavePoints[xi + 3] - wavePoints[xi + 1]) / (Math.abs(wavePoints[xi + 2] - wavePoints[xi]) + 1);
              if (slope > slopeThreshold) {
                const foamA = clamp((slope - slopeThreshold) * 2.8) * nd * 0.55;
                ctx.fillStyle = `rgba(235,245,250,${foamA})`;
                ctx.fillRect(wavePoints[xi] - 2, wavePoints[xi + 1] - 1, 8 + nd * 16, 2 + nd * 3);
              }
            }
          }

          // Foam streaks in high wind
          if (windSpeed > 17 && nd > 0.38 && !REDUCED) {
            ctx.strokeStyle = `rgba(225,238,245,${clamp((windSpeed - 17) / 20) * nd * 0.32})`;
            ctx.lineWidth = 0.5 + nd;
            for (let fi = 0; fi < 3; fi++) {
              const fx = randSeed(bi * 10 + fi + 7500) * W;
              const fy = y + randSeed(bi * 10 + fi + 7600) * perspAmp;
              ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx + 20 + nd * 42, fy + 2); ctx.stroke();
            }
          }
        }

        // Cyclone visibility: apply exponential distance fog across whole ocean
        if (weather.cycloneActive && weather.cycloneWindSpeed > 16) {
          const visMeters = mix(150, 50, clamp((weather.cycloneWindSpeed - 16) / 16));
          const fogSteps = 20;
          for (let fs = 0; fs < fogSteps; fs++) {
            const u0 = fs / fogSteps, u1 = (fs + 1) / fogSteps;
            const y0 = horizonY + bandH * u0, y1 = horizonY + bandH * u1;
            const dMid = mix(2500, 30, Math.pow((u0 + u1) * 0.5, 0.72));
            const fogA = (1 - Math.exp(-dMid / visMeters)) * 0.92;
            ctx.fillStyle = `rgba(122, 128, 134, ${fogA})`;
            ctx.fillRect(-W * 0.25, y0, W * 1.5, y1 - y0 + 1);
          }
        }

        // Glitter reflection centered at body's actual screen X, scaling with altitude
        const sunActive = (cel.sunAlt >= -1.5) && (cel.sunFadeV > 0.01 || sunrise > 0.02 || sunset > 0.02);
        const moonActive = cel.moonUp && cel.moonFade > 0.015 && cel.illumFraction > 0.02;
        const bodyActive = sunActive || moonActive;
        if (bodyActive && weather.rain < 0.6) {
          const targetX = sunActive ? cel.sunX : cel.moonX;
          const bodyAlt = sunActive ? cel.sunAlt : cel.moonAlt;
          const fadeV = (sunActive ? cel.sunFadeV : cel.moonFade * cel.illumFraction) * (1 - weather.rain * 1.5);
          const elev = sunActive ? cel.sunElev : clamp(bodyAlt / 60);
          const onScreen = (targetX >= -W * 0.15 && targetX <= W * 0.85);

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(0, horizonY);
          ctx.lineTo(W * 0.70, horizonY);
          ctx.lineTo(W * 0.06, H);
          ctx.lineTo(0, H);
          ctx.closePath();
          ctx.clip();

          if (onScreen) {
            const altNorm = clamp(bodyAlt / 60);
            const trailLengthFactor = mix(1.25, 0.55, altNorm);
            const headingShear = Math.sin((ZONES.SHIP.heading - 135) * PI / 180) * 0.12;

            for (let i = 0; i < GLITTER_COUNT; i++) {
              const gp = glitterParticles[i];
              const effectiveDepth = gp.depth * trailLengthFactor;
              if (effectiveDepth > 1.0) continue;
              const gy = horizonY + effectiveDepth * (H - horizonY);
              if (gy > H) continue;

              const coneW = (W * 0.02 + effectiveDepth * W * 0.28) * (1.2 - altNorm * 0.35);
              const gx = targetX + gp.seedX * coneW - effectiveDepth * W * headingShear;
              if (gx < 0 || gx > W * 0.75) continue;

              const flicker = 0.5 + 0.5 * Math.sin(t * gp.speed * motionScale + gp.phase);
              const da = (1 - effectiveDepth * 0.65) * (0.12 + flicker * 0.88) * fadeV;
              if (da < 0.012) continue;

              const dw = gp.len * (0.35 + effectiveDepth * 1.1) * (1.1 - altNorm * 0.3);
              const dh = 0.8 + effectiveDepth * 1.8;

              if (sunActive) {
                const gRed = 255;
                const gGreen = Math.round(mix(125, 245, elev));
                const gBlue = Math.round(mix(35, 210, elev));
                ctx.fillStyle = `rgba(${gRed},${gGreen},${gBlue},${da * 0.88})`;
              } else {
                ctx.fillStyle = `rgba(205,225,255,${da * 0.72})`;
              }
              ctx.fillRect(gx - dw * 0.5, gy - dh * 0.5, dw, dh);
            }
          } else {
            const dirLeft = targetX < 0;
            const diffuseGrad = ctx.createRadialGradient(dirLeft ? 0 : W * 0.6, horizonY + (H - horizonY) * 0.3, 0,
              dirLeft ? 0 : W * 0.6, horizonY + (H - horizonY) * 0.3, W * 0.4);
            const col = sunActive ? [240, 180, 120] : [180, 205, 240];
            diffuseGrad.addColorStop(0, `rgba(${col[0]},${col[1]},${col[2]},${0.10 * fadeV})`);
            diffuseGrad.addColorStop(1, `rgba(${col[0]},${col[1]},${col[2]},0)`);
            ctx.fillStyle = diffuseGrad;
            ctx.fillRect(0, horizonY, W * 0.7, H - horizonY);
          }
          ctx.restore();
        }

        // Wake foam
        {
          ctx.save();
          for (let k = 0; k < 18; k++) {
            const wt = k / 17;
            const wx = mix(W * 0.08, vpX - W * 0.01, wt) - Math.sin(t * 6 + k) * 4 * (1 - wt);
            const wy = mix(H * 0.98, vpY + 2, wt);
            const wr = (16 * (1 - wt) + 2);
            const wakeGrad = ctx.createRadialGradient(wx, wy, 0, wx, wy, wr);
            wakeGrad.addColorStop(0, `rgba(255,255,255,${0.55 * (1 - wt * 0.6)})`);
            wakeGrad.addColorStop(0.5, `rgba(215,245,255,${0.28 * (1 - wt * 0.6)})`);
            wakeGrad.addColorStop(1, 'rgba(200,240,255,0)');
            ctx.fillStyle = wakeGrad; ctx.beginPath(); ctx.arc(wx, wy, wr, 0, TAU); ctx.fill();
          }
          ctx.restore();
        }

        ctx.restore(); // end tilted external celestial & ocean view

        /* ── 6. Teak Deck ───────────────────────────────────────────────── */
        const dL_botX = W * 0.04, dL_botY = H;
        const dL_topX = vpX - W * 0.025, dL_topY = vpY + 2;
        const dL_ctrlX = W * 0.25, dL_ctrlY = H * 0.78;
        const dR_botX = W * 0.68, dR_botY = H;
        const dR_topX = vpX + W * 0.035, dR_topY = vpY + 2;
        const dR_ctrlX = W * 0.65, dR_ctrlY = H * 0.75;

        ctx.save();
        const teakTones = [[154, 107, 63], [165, 116, 69], [176, 125, 75], [185, 132, 80], [192, 138, 82]];
        const PLANK_COUNT = 32;
        for (let pi = 0; pi < PLANK_COUNT; pi++) {
          const u0 = pi / PLANK_COUNT, u1 = (pi + 1) / PLANK_COUNT;
          const x_b0 = mix(dL_botX, dR_botX, u0), x_b1 = mix(dL_botX, dR_botX, u1);
          const x_t0 = mix(dL_topX, dR_topX, u0), x_t1 = mix(dL_topX, dR_topX, u1);
          const x_c0 = mix(dL_ctrlX, dR_ctrlX, u0), x_c1 = mix(dL_ctrlX, dR_ctrlX, u1);
          ctx.beginPath(); ctx.moveTo(x_b0, dL_botY);
          ctx.quadraticCurveTo(x_c0, dL_ctrlY, x_t0, dL_topY);
          ctx.lineTo(x_t1, dR_topY); ctx.quadraticCurveTo(x_c1, dR_ctrlY, x_b1, dL_botY); ctx.closePath();
          let pCol = [...teakTones[pi % teakTones.length]];
          if (warm > 0.05) pCol = lerpColor(pCol, [255, 165, 70], warm * 0.38);
          if (golden > 0.05) pCol = lerpColor(pCol, [255, 185, 90], golden * 0.22);
          if (night > 0.2) pCol = lerpColor(pCol, [18, 14, 22], night * 0.78);
          ctx.fillStyle = rgb(pCol); ctx.fill();
          const caulkCol = night > 0.3 ? '#0a080c' : '#281b12';
          ctx.beginPath(); ctx.moveTo(x_b1, dL_botY); ctx.quadraticCurveTo(x_c1, dL_ctrlY, x_t1, dR_topY);
          ctx.strokeStyle = caulkCol; ctx.lineWidth = 1; ctx.stroke();
        }

        // Deck edges
        ctx.beginPath(); ctx.moveTo(dL_botX, dL_botY); ctx.quadraticCurveTo(dL_ctrlX, dL_ctrlY, dL_topX, dL_topY);
        ctx.strokeStyle = night > 0.3 ? '#120e18' : '#452a16'; ctx.lineWidth = 5; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(dR_botX, dR_botY); ctx.quadraticCurveTo(dR_ctrlX, dR_ctrlY, dR_topX, dR_topY);
        ctx.strokeStyle = night > 0.3 ? '#120e18' : '#452a16'; ctx.lineWidth = 6; ctx.stroke();

        // Deck sheen
        {
          const sheenGrad = ctx.createLinearGradient(0, horizonY, 0, H * 0.75);
          sheenGrad.addColorStop(0, `rgba(${wp[2][0]},${wp[2][1]},${wp[2][2]},0.18)`);
          sheenGrad.addColorStop(0.5, `rgba(${wp[2][0]},${wp[2][1]},${wp[2][2]},0.06)`);
          sheenGrad.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.beginPath(); ctx.moveTo(dL_botX, dL_botY); ctx.quadraticCurveTo(dL_ctrlX, dL_ctrlY, dL_topX, dL_topY);
          ctx.lineTo(dR_topX, dR_topY); ctx.quadraticCurveTo(dR_ctrlX, dR_ctrlY, dR_botX, dR_botY); ctx.closePath();
          ctx.fillStyle = sheenGrad; ctx.fill();
        }

        // Water on deck in high seas
        if (clampedHs > 3 && !REDUCED) {
          const deckWet = clamp((clampedHs - 3) / 5) * 0.15;
          ctx.fillStyle = `rgba(80,120,150,${deckWet})`;
          ctx.beginPath(); ctx.moveTo(dL_botX, dL_botY); ctx.quadraticCurveTo(dL_ctrlX, dL_ctrlY, dL_topX, dL_topY);
          ctx.lineTo(dR_topX, dR_topY); ctx.quadraticCurveTo(dR_ctrlX, dR_ctrlY, dR_botX, dR_botY); ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        /* ── 7. Railing ─────────────────────────────────────────────────── */
        ctx.save();
        {
          ctx.beginPath(); ctx.moveTo(dL_botX - 2, dL_botY); ctx.quadraticCurveTo(dL_ctrlX - 2, dL_ctrlY, dL_topX - 1, dL_topY);
          ctx.lineTo(dL_topX + 2, dL_topY); ctx.quadraticCurveTo(dL_ctrlX + 3, dL_ctrlY, dL_botX + 6, dL_botY); ctx.closePath();
          const kpCol = lerpColor([242, 246, 250], [255, 210, 170], warm * 0.5);
          const kpNight = lerpColor(kpCol, [50, 65, 85], night * 0.75);
          ctx.fillStyle = rgb(kpNight); ctx.fill();
        }

        const POST_COUNT = 24;
        const postCoords = [];
        for (let pi = 0; pi < POST_COUNT; pi++) {
          const u = pi / (POST_COUNT - 1);
          const pt = Math.pow(u, 1.85);
          const px = (1 - pt) * (1 - pt) * dL_botX + 2 * (1 - pt) * pt * dL_ctrlX + pt * pt * dL_topX;
          const py = (1 - pt) * (1 - pt) * dL_botY + 2 * (1 - pt) * pt * dL_ctrlY + pt * pt * dL_topY;
          const postH = mix(H * 0.17, 4, pt);
          const postW = mix(5.5, 1.2, pt);
          postCoords.push({ px, py, postH, postW, pt });
        }

        let postCol = lerpColor([248, 250, 252], [255, 205, 160], warm * 0.65);
        if (night > 0.2) postCol = lerpColor(postCol, [60, 78, 102], night * 0.75);

        for (const pc of postCoords) {
          ctx.fillStyle = rgb(postCol);
          ctx.fillRect(pc.px - pc.postW * 0.5, pc.py - pc.postH, pc.postW, pc.postH);
          ctx.fillStyle = 'rgba(0,0,0,0.22)';
          ctx.fillRect(pc.px, pc.py - pc.postH, pc.postW * 0.5, pc.postH);
        }

        const railHFracs = [0.28, 0.55, 0.82];
        for (const rh of railHFracs) {
          ctx.beginPath(); ctx.moveTo(postCoords[0].px, postCoords[0].py - postCoords[0].postH * rh);
          for (let i = 1; i < postCoords.length; i++) ctx.lineTo(postCoords[i].px, postCoords[i].py - postCoords[i].postH * rh);
          ctx.strokeStyle = rgb(postCol); ctx.lineWidth = mix(2.4, 0.8, rh); ctx.stroke();
        }

        // Mahogany handrail
        {
          ctx.beginPath(); ctx.moveTo(postCoords[0].px, postCoords[0].py - postCoords[0].postH);
          for (let i = 1; i < postCoords.length; i++) ctx.lineTo(postCoords[i].px, postCoords[i].py - postCoords[i].postH);
          ctx.strokeStyle = night > 0.3 ? '#2c1a10' : '#7A4A2A'; ctx.lineWidth = mix(8, 1.6, 0); ctx.lineCap = 'round'; ctx.stroke();
          let hlCol = 'rgba(215,165,120,0.85)';
          if (warm > 0.05) hlCol = `rgba(255,210,140,${0.90 + warm * 0.1})`;
          if (night > 0.2) hlCol = `rgba(180,205,235,${0.35 * night})`;
          ctx.beginPath(); ctx.moveTo(postCoords[0].px, postCoords[0].py - postCoords[0].postH - 2.2);
          for (let i = 1; i < postCoords.length; i++) ctx.lineTo(postCoords[i].px, postCoords[i].py - postCoords[i].postH - mix(2.2, 0.5, postCoords[i].pt));
          ctx.strokeStyle = hlCol; ctx.lineWidth = mix(1.8, 0.6, 0); ctx.stroke();
        }
        ctx.restore();

        /* ═════════════════════════════════════════════════════════════════
           8) SHIP HULL, DECKS, WINDOWS & LIGHTS
           ═════════════════════════════════════════════════════════════════ */
        ctx.save();

        const wetAir = 1 + (weather.rain * 0.65 + weather.fog * 0.45 + (weather.cycloneActive ? weather.cycloneWindSpeed / 40 : 0));
        const stormDarkFactor = clamp((weather.darkness - 0.15) / 0.45);

        // 5 Boundary curves for the 4 tiers:
        const E0 = {
          p0: { x: dR_topX, y: dR_topY },
          p1: { x: W * 0.75, y: H * 0.58 },
          p2: { x: W, y: H * 0.50 }
        };
        const E1 = {
          p0: { x: vpX + W * 0.045, y: vpY + H * 0.015 },
          p1: { x: W * 0.77, y: H * 0.52 },
          p2: { x: W, y: H * 0.49 }
        };
        const E2 = {
          p0: { x: vpX + W * 0.065, y: vpY - H * 0.012 },
          p1: { x: W * 0.79, y: H * 0.39 },
          p2: { x: W, y: H * 0.35 }
        };
        const E3 = {
          p0: { x: vpX + W * 0.085, y: vpY - H * 0.045 },
          p1: { x: W * 0.81, y: H * 0.25 },
          p2: { x: W, y: H * 0.19 }
        };
        const E4 = {
          p0: { x: vpX + W * 0.115, y: vpY - H * 0.075 },
          p1: { x: W * 0.83, y: H * 0.13 },
          p2: { x: W, y: H * 0.08 }
        };

        // ONE Path2D for the real hull outline (union of tier polygons plus lower hull)
        const hullOutline = new Path2D();
        hullOutline.moveTo(dR_botX, dR_botY);
        hullOutline.quadraticCurveTo(dR_ctrlX, dR_ctrlY, dR_topX, dR_topY);
        hullOutline.lineTo(E1.p0.x, E1.p0.y);
        hullOutline.lineTo(E2.p0.x, E2.p0.y);
        hullOutline.lineTo(E3.p0.x, E3.p0.y);
        hullOutline.lineTo(E4.p0.x, E4.p0.y);
        hullOutline.quadraticCurveTo(E4.p1.x, E4.p1.y, E4.p2.x, E4.p2.y);
        hullOutline.lineTo(W, H);
        hullOutline.lineTo(dR_botX, H);
        hullOutline.closePath();

        // A. Lower Hull: Deep navy blue with vertical gradient
        {
          ctx.beginPath();
          ctx.moveTo(dR_botX, dR_botY);
          ctx.quadraticCurveTo(dR_ctrlX, dR_ctrlY, dR_topX, dR_topY);
          ctx.quadraticCurveTo(E0.p1.x, E0.p1.y, E0.p2.x, E0.p2.y);
          ctx.lineTo(W, H);
          ctx.closePath();

          let hullTop = [16, 38, 72];
          let hullBot = [8, 20, 42];
          if (warm > 0.05) { hullTop = lerpColor(hullTop, [95, 52, 45], warm * 0.28); hullBot = lerpColor(hullBot, [48, 26, 34], warm * 0.28); }
          if (night > 0.2) { hullTop = lerpColor(hullTop, [8, 18, 38], night * 0.75); hullBot = lerpColor(hullBot, [4, 10, 24], night * 0.78); }

          const hullGrad = ctx.createLinearGradient(vpX, vpY, W, H);
          hullGrad.addColorStop(0, rgb(hullTop));
          hullGrad.addColorStop(0.55, rgb(hullBot));
          hullGrad.addColorStop(1, rgb(hullBot.map(v => Math.max(0, v - 8))));
          ctx.fillStyle = hullGrad;
          ctx.fill();

          // Waterline boot-topping stripe
          ctx.beginPath();
          ctx.moveTo(mix(dR_botX, dR_topX, 0.35), mix(dR_botY, dR_topY, 0.35));
          ctx.lineTo(W, H * 0.65);
          ctx.strokeStyle = night > 0.3 ? 'rgba(170, 190, 220, 0.40)' : 'rgba(255, 255, 255, 0.85)';
          ctx.lineWidth = 2.5;
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(mix(dR_botX, dR_topX, 0.39), mix(dR_botY, dR_topY, 0.39));
          ctx.lineTo(W, H * 0.67);
          ctx.strokeStyle = night > 0.3 ? 'rgba(130, 150, 180, 0.30)' : 'rgba(235, 240, 248, 0.60)';
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }

        // B. Upper Superstructure Tiers: SOLID Ivory/White with vertical gradient
        let structTop = [252, 250, 246];
        let structBot = [228, 224, 216];
        if (warm > 0.05) {
          structTop = lerpColor(structTop, [255, 224, 195], warm * 0.45);
          structBot = lerpColor(structBot, [238, 198, 168], warm * 0.45);
        }
        if (night > 0.2) {
          structTop = lerpColor(structTop, [42, 54, 72], night * 0.75);
          structBot = lerpColor(structBot, [24, 32, 46], night * 0.80);
        }

        // Tier 1 (between E0 and E1)
        {
          ctx.beginPath();
          ctx.moveTo(E1.p0.x, E1.p0.y);
          ctx.quadraticCurveTo(E1.p1.x, E1.p1.y, E1.p2.x, E1.p2.y);
          ctx.lineTo(E0.p2.x, E0.p2.y);
          ctx.quadraticCurveTo(E0.p1.x, E0.p1.y, E0.p0.x, E0.p0.y);
          ctx.closePath();

          const t1Grad = ctx.createLinearGradient(0, vpY, 0, H * 0.52);
          t1Grad.addColorStop(0, rgb(structTop));
          t1Grad.addColorStop(1, rgb(structBot));
          ctx.fillStyle = t1Grad;
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(E1.p0.x, E1.p0.y);
          ctx.quadraticCurveTo(E1.p1.x, E1.p1.y, E1.p2.x, E1.p2.y);
          ctx.strokeStyle = night > 0.3 ? '#0e1622' : '#2a3545';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        // Tier 2 (between E1 and E2)
        {
          ctx.beginPath();
          ctx.moveTo(E2.p0.x, E2.p0.y);
          ctx.quadraticCurveTo(E2.p1.x, E2.p1.y, E2.p2.x, E2.p2.y);
          ctx.lineTo(E1.p2.x, E1.p2.y);
          ctx.quadraticCurveTo(E1.p1.x, E1.p1.y, E1.p0.x, E1.p0.y);
          ctx.closePath();

          const t2Grad = ctx.createLinearGradient(0, vpY - H * 0.02, 0, H * 0.49);
          t2Grad.addColorStop(0, rgb(structTop));
          t2Grad.addColorStop(1, rgb(structBot));
          ctx.fillStyle = t2Grad;
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(E2.p0.x, E2.p0.y);
          ctx.quadraticCurveTo(E2.p1.x, E2.p1.y, E2.p2.x, E2.p2.y);
          ctx.strokeStyle = night > 0.3 ? '#0e1622' : '#2a3545';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        // Tier 3 (between E2 and E3)
        {
          ctx.beginPath();
          ctx.moveTo(E3.p0.x, E3.p0.y);
          ctx.quadraticCurveTo(E3.p1.x, E3.p1.y, E3.p2.x, E3.p2.y);
          ctx.lineTo(E2.p2.x, E2.p2.y);
          ctx.quadraticCurveTo(E2.p1.x, E2.p1.y, E2.p0.x, E2.p0.y);
          ctx.closePath();

          const t3Grad = ctx.createLinearGradient(0, vpY - H * 0.05, 0, H * 0.35);
          t3Grad.addColorStop(0, rgb(structTop));
          t3Grad.addColorStop(1, rgb(structBot));
          ctx.fillStyle = t3Grad;
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(E3.p0.x, E3.p0.y);
          ctx.quadraticCurveTo(E3.p1.x, E3.p1.y, E3.p2.x, E3.p2.y);
          ctx.strokeStyle = night > 0.3 ? '#0e1622' : '#2a3545';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        // Tier 4 (between E3 and E4)
        {
          ctx.beginPath();
          ctx.moveTo(E4.p0.x, E4.p0.y);
          ctx.quadraticCurveTo(E4.p1.x, E4.p1.y, E4.p2.x, E4.p2.y);
          ctx.lineTo(E3.p2.x, E3.p2.y);
          ctx.quadraticCurveTo(E3.p1.x, E3.p1.y, E3.p0.x, E3.p0.y);
          ctx.closePath();

          const t4Grad = ctx.createLinearGradient(0, vpY - H * 0.08, 0, H * 0.19);
          t4Grad.addColorStop(0, rgb(structTop));
          t4Grad.addColorStop(1, rgb(structBot));
          ctx.fillStyle = t4Grad;
          ctx.fill();

          // Top roofline fascia edge
          ctx.beginPath();
          ctx.moveTo(E4.p0.x, E4.p0.y);
          ctx.quadraticCurveTo(E4.p1.x, E4.p1.y, E4.p2.x, E4.p2.y);
          ctx.strokeStyle = night > 0.3 ? '#0e1622' : '#2a3545';
          ctx.lineWidth = 1.8;
          ctx.stroke();
        }

        // Faint sky reflection on white surfaces
        {
          const skyReflGrad = ctx.createLinearGradient(0, vpY - H * 0.08, 0, H * 0.50);
          skyReflGrad.addColorStop(0, `rgba(${wp[1][0] | 0},${wp[1][1] | 0},${wp[1][2] | 0},0.09)`);
          skyReflGrad.addColorStop(1, `rgba(${wp[2][0] | 0},${wp[2][1] | 0},${wp[2][2] | 0},0.03)`);

          ctx.save();
          ctx.beginPath();
          ctx.moveTo(E4.p0.x, E4.p0.y);
          ctx.quadraticCurveTo(E4.p1.x, E4.p1.y, E4.p2.x, E4.p2.y);
          ctx.lineTo(W, H * 0.50);
          ctx.lineTo(dR_topX, dR_topY);
          ctx.closePath();
          ctx.fillStyle = skyReflGrad;
          ctx.fill();
          ctx.restore();
        }

        // Warm rim light along deck fascia edges at sunrise/sunset
        if (warm > 0.04) {
          ctx.save();
          ctx.strokeStyle = `rgba(242,198,160,${0.50 * warm})`;
          ctx.lineWidth = 2.0;
          ctx.beginPath(); ctx.moveTo(E1.p0.x, E1.p0.y); ctx.quadraticCurveTo(E1.p1.x, E1.p1.y, E1.p2.x, E1.p2.y); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(E2.p0.x, E2.p0.y); ctx.quadraticCurveTo(E2.p1.x, E2.p1.y, E2.p2.x, E2.p2.y); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(E3.p0.x, E3.p0.y); ctx.quadraticCurveTo(E3.p1.x, E3.p1.y, E3.p2.x, E3.p2.y); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(E4.p0.x, E4.p0.y); ctx.quadraticCurveTo(E4.p1.x, E4.p1.y, E4.p2.x, E4.p2.y); ctx.stroke();
          ctx.restore();
        }

        // 4 Midline curves for window placement:
        // Place each window row on vertical midline between top and bottom edge curve of its tier
        const deckMidlines = [
          {
            p0: { x: (E0.p0.x + E1.p0.x) * 0.5, y: (E0.p0.y + E1.p0.y) * 0.5 },
            p1: { x: (E0.p1.x + E1.p1.x) * 0.5, y: (E0.p1.y + E1.p1.y) * 0.5 },
            p2: { x: (E0.p2.x + E1.p2.x) * 0.5, y: (E0.p2.y + E1.p2.y) * 0.5 }
          },
          {
            p0: { x: (E1.p0.x + E2.p0.x) * 0.5, y: (E1.p0.y + E2.p0.y) * 0.5 },
            p1: { x: (E1.p1.x + E2.p1.x) * 0.5, y: (E1.p1.y + E2.p1.y) * 0.5 },
            p2: { x: (E1.p2.x + E2.p2.x) * 0.5, y: (E1.p2.y + E2.p2.y) * 0.5 }
          },
          {
            p0: { x: (E2.p0.x + E3.p0.x) * 0.5, y: (E2.p0.y + E3.p0.y) * 0.5 },
            p1: { x: (E2.p1.x + E3.p1.x) * 0.5, y: (E2.p1.y + E3.p1.y) * 0.5 },
            p2: { x: (E2.p2.x + E3.p2.x) * 0.5, y: (E2.p2.y + E3.p2.y) * 0.5 }
          },
          {
            p0: { x: (E3.p0.x + E4.p0.x) * 0.5, y: (E3.p0.y + E4.p0.y) * 0.5 },
            p1: { x: (E3.p1.x + E4.p1.x) * 0.5, y: (E3.p1.y + E4.p1.y) * 0.5 },
            p2: { x: (E3.p2.x + E4.p2.x) * 0.5, y: (E3.p2.y + E4.p2.y) * 0.5 }
          }
        ];

        // Clip strictly to hullOutline Path2D so windows and lights never appear against the sky
        ctx.save();
        ctx.clip(hullOutline);

        const glowCanvas = getWindowGlowCanvas();

        for (const win of shipWindows) {
          const curve = deckMidlines[win.deck];
          const u = win.u;

          const invU = 1 - u;
          const wx = invU * invU * curve.p0.x + 2 * invU * u * curve.p1.x + u * u * curve.p2.x;
          const wy = invU * invU * curve.p0.y + 2 * invU * u * curve.p1.y + u * u * curve.p2.y;

          const tx = 2 * invU * (curve.p1.x - curve.p0.x) + 2 * u * (curve.p2.x - curve.p1.x);
          const ty = 2 * invU * (curve.p1.y - curve.p0.y) + 2 * u * (curve.p2.y - curve.p1.y);
          const theta = Math.atan2(ty, tx);

          const scale = mix(0.34, 1.0, Math.pow(u, 1.15));
          const winW = W * 0.022 * scale;
          const winH = H * 0.024 * scale;
          const rr = Math.max(1.2, 2.5 * scale);

          // Turn lights on/off from sun altitude: starts below +2 deg, all on by -8 deg, off in reverse at dawn
          let lightVal = 0;
          if (win.isLitCandidate) {
            if (cel.sunAlt <= win.altThreshold) {
              lightVal = clamp((win.altThreshold - cel.sunAlt) / 1.5);
            }
          }
          if (stormDarkFactor > 0 && win.isLitCandidate) {
            lightVal = Math.max(lightVal, stormDarkFactor * 0.85);
          }

          ctx.save();
          ctx.translate(wx, wy);
          ctx.rotate(theta);

          ctx.beginPath();
          ctx.moveTo(-winW / 2 + rr, -winH / 2);
          ctx.lineTo(winW / 2 - rr, -winH / 2);
          ctx.arcTo(winW / 2, -winH / 2, winW / 2, -winH / 2 + rr, rr);
          ctx.lineTo(winW / 2, winH / 2 - rr);
          ctx.arcTo(winW / 2, winH / 2, winW / 2 - rr, winH / 2, rr);
          ctx.lineTo(-winW / 2 + rr, winH / 2);
          ctx.arcTo(-winW / 2, winH / 2, -winW / 2, winH / 2 - rr, rr);
          ctx.lineTo(-winW / 2, -winH / 2 + rr);
          ctx.arcTo(-winW / 2, -winH / 2, -winW / 2 + rr, -winH / 2, rr);
          ctx.closePath();

          if (lightVal > 0.05) {
            const flick = win.flicker ? (1 + 0.06 * Math.sin(t * 3.5 + win.flickerPhase)) : 1.0;
            const bMod = (1 + win.warmShift) * flick;

            const rCenter = 255;
            const gCenter = Math.round(clamp(226 * bMod, 180, 255));
            const bCenter = Math.round(clamp(176 * bMod, 120, 220));

            const rEdge = 255;
            const gEdge = Math.round(clamp(184 * bMod, 140, 220));
            const bEdge = Math.round(clamp(102 * bMod, 60, 150));

            const winGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, winW * 0.7);
            winGrad.addColorStop(0, `rgba(${rCenter},${gCenter},${bCenter},${0.95 * lightVal})`);
            winGrad.addColorStop(1, `rgba(${rEdge},${gEdge},${bEdge},${0.88 * lightVal})`);
            ctx.fillStyle = winGrad;
            ctx.fill();

            if (win.curtain) {
              ctx.save();
              ctx.beginPath();
              ctx.rect(-winW / 2, -winH / 2, winW * 0.45, winH);
              ctx.fillStyle = `rgba(55, 38, 28, ${0.75 * lightVal})`;
              ctx.fill();
              ctx.restore();
            }

            ctx.strokeStyle = '#181210';
            ctx.lineWidth = 1;
            ctx.stroke();

            // Soft light spill on hull immediately below window
            const spillH = winH * 1.25;
            const spillGrad = ctx.createLinearGradient(0, winH / 2, 0, winH / 2 + spillH);
            spillGrad.addColorStop(0, `rgba(255, 195, 120, ${0.28 * lightVal * flick})`);
            spillGrad.addColorStop(1, 'rgba(255, 195, 120, 0)');
            ctx.fillStyle = spillGrad;
            ctx.fillRect(-winW * 0.6, winH / 2, winW * 1.2, spillH);

            // Bloom: soft radial glow using pre-rendered canvas and 'lighter' blend
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const bloomSize = winW * 3.8 * wetAir;
            ctx.globalAlpha = 0.22 * lightVal * flick;
            ctx.drawImage(glowCanvas, -bloomSize / 2, -bloomSize / 2, bloomSize, bloomSize);
            ctx.restore();

          } else {
            const skyHorizonCol = wp[2];
            const glassBase = [36, 50, 68];
            let glassCol = lerpColor(glassBase, skyHorizonCol, 0.35);
            const rainDark = 1 - weather.rain * 0.35 - weather.fog * 0.35;
            glassCol = glassCol.map(v => Math.round(v * rainDark));

            ctx.fillStyle = rgb(glassCol, 0.85);
            ctx.fill();

            ctx.strokeStyle = '#121822';
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-winW / 2 + rr, -winH / 2 + 0.5);
            ctx.lineTo(winW / 2 - rr, -winH / 2 + 0.5);
            const hlAlpha = (0.35 + warm * 0.25) * (1 - weather.darkness * 0.5);
            ctx.strokeStyle = `rgba(255, 255, 255, ${hlAlpha})`;
            ctx.lineWidth = 0.8;
            ctx.stroke();
          }

          ctx.restore();
        }

        ctx.restore(); // end hull clipping for windows

        // Water reflection under ship side
        {
          const sunNightFactor = clamp((2.0 - cel.sunAlt) / 10.0);
          let nightShipRefl = sunNightFactor;
          if (stormDarkFactor > 0) nightShipRefl = Math.max(nightShipRefl, stormDarkFactor * 0.7);

          if (nightShipRefl > 0.03) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const waveRough = clamp(weather.wind * 1.2, 0.15, 1.0);
            const reflCols = [
              { x: W * 0.70, w: W * 0.026, c: [255, 200, 115] },
              { x: W * 0.74, w: W * 0.030, c: [255, 215, 130] },
              { x: W * 0.78, w: W * 0.032, c: [255, 195, 110] },
              { x: W * 0.83, w: W * 0.028, c: [255, 210, 125] },
              { x: W * 0.88, w: W * 0.025, c: [255, 190, 105] },
              { x: W * 0.84, w: W * 0.012, c: [255, 34, 51] },
              { x: W * 0.92, w: W * 0.012, c: [0, 255, 102] }
            ];

            for (const col of reflCols) {
              const startY = horizonY + 8;
              const endY = H * 0.96;
              const slices = 16;
              for (let s = 0; s < slices; s++) {
                const u = s / (slices - 1);
                const sy = mix(startY, endY, u);
                const distFade = (1 - u * 0.65) * (1 - waveRough * 0.3);
                const wobble = Math.sin(t * 3.8 + s * 1.5 + col.x * 0.015) * (3 + waveRough * 8);
                const sw = col.w * (0.8 + u * 1.1) + waveRough * 10;
                const sh = mix(1.4, 3.2, u);
                const alpha = nightShipRefl * distFade * (0.04 + 0.05 * Math.sin(t * 2.5 + s * 0.9));
                if (alpha <= 0.005) continue;
                ctx.fillStyle = `rgba(${col.c[0]},${col.c[1]},${col.c[2]},${alpha})`;
                ctx.fillRect(col.x + wobble - sw * 0.5, sy, sw, sh);
              }
            }
            ctx.restore();
          }
        }

        // DECK LAMPS: Small warm point lights along railing and upper deck with soft pool on planks
        {
          const sunNightFactor = clamp((2.0 - cel.sunAlt) / 10.0);
          let lampPower = sunNightFactor;
          if (stormDarkFactor > 0) lampPower = Math.max(lampPower, stormDarkFactor * 0.8);

          if (lampPower > 0.05) {
            for (let li = 0; li < deckLamps.length; li++) {
              const lamp = deckLamps[li];
              const lx = lamp.railX * W;
              const ly = lamp.railY * H;
              const px = lamp.poolX * W;
              const py = lamp.poolY * H;
              const pr = lamp.poolR * W;
              const flick = 0.92 + 0.08 * Math.sin(t * (3.2 + li * 0.8) + li * 7);

              // Soft elliptical pool on planks
              ctx.save();
              ctx.translate(px, py);
              ctx.scale(2.2, 0.65);
              const poolGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, pr);
              poolGrad.addColorStop(0, `rgba(255, 220, 140, ${0.32 * lampPower * flick})`);
              poolGrad.addColorStop(0.5, `rgba(255, 180, 85, ${0.10 * lampPower * flick})`);
              poolGrad.addColorStop(1, 'rgba(255, 180, 85, 0)');
              ctx.fillStyle = poolGrad;
              ctx.beginPath();
              ctx.arc(0, 0, pr, 0, TAU);
              ctx.fill();
              ctx.restore();

              // Small warm point light source on railing
              ctx.fillStyle = `rgba(255, 240, 185, ${0.95 * lampPower * flick})`;
              ctx.beginPath();
              ctx.arc(lx, ly, 2.2, 0, TAU);
              ctx.fill();

              ctx.strokeStyle = `rgba(255, 230, 160, ${0.45 * lampPower * flick})`;
              ctx.lineWidth = 0.7;
              ctx.beginPath();
              ctx.moveTo(lx - 4, ly); ctx.lineTo(lx + 4, ly);
              ctx.moveTo(lx, ly - 4); ctx.lineTo(lx, ly + 4);
              ctx.stroke();

              ctx.save();
              ctx.globalCompositeOperation = 'lighter';
              const glowR = W * 0.035 * wetAir;
              const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, glowR);
              lg.addColorStop(0, `rgba(255, 215, 130, ${0.30 * lampPower * flick})`);
              lg.addColorStop(0.5, `rgba(255, 175, 75, ${0.08 * lampPower * flick})`);
              lg.addColorStop(1, 'rgba(255, 175, 75, 0)');
              ctx.fillStyle = lg;
              ctx.fillRect(lx - glowR, ly - glowR, glowR * 2, glowR * 2);
              ctx.restore();
            }
          }
        }

        // NAVIGATION LIGHTS: Red (port), Green (starboard), White (masthead)
        // Mast base anchored directly on the roof curve E4 so it does not float above it!
        {
          const mastU = 0.76;
          const invMastU = 1 - mastU;
          const mastX = invMastU * invMastU * E4.p0.x + 2 * invMastU * mastU * E4.p1.x + mastU * mastU * E4.p2.x;
          const mastBaseY = invMastU * invMastU * E4.p0.y + 2 * invMastU * mastU * E4.p1.y + mastU * mastU * E4.p2.y;
          const mastTopY = mastBaseY - H * 0.085;
          const yardY = mastBaseY - H * 0.045;
          const yardW = W * 0.038;

          // Solid Mast structure anchored on roof curve
          ctx.strokeStyle = night > 0.3 ? '#2a3848' : '#8898aa';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          ctx.moveTo(mastX, mastBaseY);
          ctx.lineTo(mastX, mastTopY);
          ctx.stroke();

          // Yardarm crossbar
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(mastX - yardW, yardY);
          ctx.lineTo(mastX + yardW, yardY);
          ctx.stroke();

          // Shroud rigging wires anchored on roofline
          ctx.lineWidth = 0.7;
          ctx.strokeStyle = night > 0.3 ? 'rgba(45, 60, 80, 0.45)' : 'rgba(150, 165, 185, 0.55)';
          ctx.beginPath();
          ctx.moveTo(mastX, mastTopY + 4); ctx.lineTo(mastX - yardW * 1.15, mastBaseY + 6);
          ctx.moveTo(mastX, mastTopY + 4); ctx.lineTo(mastX + yardW * 1.15, mastBaseY + 6);
          ctx.stroke();

          // Navigation lights powered from sun altitude
          let navPower = clamp((2.0 - cel.sunAlt) / 8.0);
          if (stormDarkFactor > 0) navPower = Math.max(navPower, stormDarkFactor);

          if (navPower > 0.04) {
            const portX = mastX - yardW, portY = yardY;
            const stbdX = mastX + yardW, stbdY = yardY;
            const mastheadX = mastX, mastheadY = mastTopY;

            // Port Navigation Light (Red #FF2233)
            ctx.fillStyle = `rgba(255, 34, 51, ${0.95 * navPower})`;
            ctx.beginPath();
            ctx.arc(portX, portY, 2.2, 0, TAU);
            ctx.fill();

            ctx.strokeStyle = `rgba(255, 150, 160, ${0.5 * navPower})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(portX - 5, portY); ctx.lineTo(portX + 5, portY);
            ctx.moveTo(portX, portY - 5); ctx.lineTo(portX, portY + 5);
            ctx.stroke();

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const rBloom = ctx.createRadialGradient(portX, portY, 0, portX, portY, 15 * wetAir);
            rBloom.addColorStop(0, `rgba(255, 34, 51, ${0.48 * navPower})`);
            rBloom.addColorStop(0.5, `rgba(255, 34, 51, ${0.12 * navPower})`);
            rBloom.addColorStop(1, 'rgba(255, 34, 51, 0)');
            ctx.fillStyle = rBloom;
            ctx.fillRect(portX - 15 * wetAir, portY - 15 * wetAir, 30 * wetAir, 30 * wetAir);
            ctx.restore();

            // Starboard Navigation Light (Green #00FF66)
            ctx.fillStyle = `rgba(0, 255, 102, ${0.95 * navPower})`;
            ctx.beginPath();
            ctx.arc(stbdX, stbdY, 2.2, 0, TAU);
            ctx.fill();

            ctx.strokeStyle = `rgba(160, 255, 200, ${0.5 * navPower})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(stbdX - 5, stbdY); ctx.lineTo(stbdX + 5, stbdY);
            ctx.moveTo(stbdX, stbdY - 5); ctx.lineTo(stbdX, stbdY + 5);
            ctx.stroke();

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const gBloom = ctx.createRadialGradient(stbdX, stbdY, 0, stbdX, stbdY, 15 * wetAir);
            gBloom.addColorStop(0, `rgba(0, 255, 102, ${0.48 * navPower})`);
            gBloom.addColorStop(0.5, `rgba(0, 255, 102, ${0.12 * navPower})`);
            gBloom.addColorStop(1, 'rgba(0, 255, 102, 0)');
            ctx.fillStyle = gBloom;
            ctx.fillRect(stbdX - 15 * wetAir, stbdY - 15 * wetAir, 30 * wetAir, 30 * wetAir);
            ctx.restore();

            // Masthead White Light (#FFFFFF)
            ctx.fillStyle = `rgba(255, 255, 255, ${0.98 * navPower})`;
            ctx.beginPath();
            ctx.arc(mastheadX, mastheadY, 2.4, 0, TAU);
            ctx.fill();

            ctx.strokeStyle = `rgba(255, 255, 255, ${0.6 * navPower})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(mastheadX - 6, mastheadY); ctx.lineTo(mastheadX + 6, mastheadY);
            ctx.moveTo(mastheadX, mastheadY - 6); ctx.lineTo(mastheadX, mastheadY + 6);
            ctx.stroke();

            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            const wBloom = ctx.createRadialGradient(mastheadX, mastheadY, 0, mastheadX, mastheadY, 18 * wetAir);
            wBloom.addColorStop(0, `rgba(255, 250, 230, ${0.55 * navPower})`);
            wBloom.addColorStop(0.4, `rgba(255, 235, 190, ${0.18 * navPower})`);
            wBloom.addColorStop(1, 'rgba(255, 235, 190, 0)');
            ctx.fillStyle = wBloom;
            ctx.fillRect(mastheadX - 18 * wetAir, mastheadY - 18 * wetAir, 36 * wetAir, 36 * wetAir);
            ctx.restore();
          }
        }

        ctx.restore(); // end superstructure

        /* ── 9. Atmospheric shading & Effects ───────────────────────────── */
        {
          const shade = ctx.createLinearGradient(0, H * 0.86, 0, H);
          shade.addColorStop(0, 'rgba(4,6,18,0)'); shade.addColorStop(1, 'rgba(2,4,12,0.42)');
          ctx.fillStyle = shade; ctx.fillRect(0, H * 0.86, W, H * 0.14);
        }

        // Fog / mist
        drawFog(horizonY, now);

        // Rain
        drawRain(horizonY, true);

        // Rain drops on "lens" in heavy rain
        if (weather.rain > 0.5 && !REDUCED) {
          ctx.save();
          const dropCount = Math.floor(weather.rain * 5);
          for (let i = 0; i < dropCount; i++) {
            const dx = randSeed(i + 9500) * W;
            const dy = randSeed(i + 9600) * H * 0.6;
            const dLen = 15 + randSeed(i + 9700) * 30;
            ctx.strokeStyle = `rgba(180,200,220,${0.08 + weather.rain * 0.05})`;
            ctx.lineWidth = 2; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(dx, dy); ctx.lineTo(dx + 2, dy + dLen); ctx.stroke();
          }
          ctx.restore();
        }

        // Lightning
        drawLightning();

        // Wave slam spray burst particles
        if (_sprayParticles.length > 0) {
          ctx.save();
          for (let pi = _sprayParticles.length - 1; pi >= 0; pi--) {
            const sp = _sprayParticles[pi];
            sp.x += sp.vx;
            sp.y += sp.vy;
            sp.vy += 0.36; // gravity
            sp.life -= 0.024;
            if (sp.life <= 0) {
              _sprayParticles.splice(pi, 1);
              continue;
            }
            ctx.fillStyle = `rgba(235, 245, 255, ${sp.life * 0.65})`;
            ctx.beginPath();
            ctx.arc(sp.x, sp.y, sp.r, 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        ctx.restore(); // end main alpha+slide
      }

      /* ═══════════════════════════════════════════════════════════════════
         MAIN RENDER
         ═══════════════════════════════════════════════════════════════════ */
      let slideDir = 1;
      let _currentLabelText = '';
      let _candidateLabelText = '';
      let _candidateHeldSince = -1;
      let _labelFadeStartTime = -1;
      let _labelPendingText = '';

      function render(now) {
        const m = minute % 1440;
        const cal = getCalendarDate(simTime);
        const dayOfYear = cal.dayOfYear;

        // Real sun times and warped sky minutes for both zones
        const sunTimesM = getSunTimes(dayOfYear, ZONES.MOUNTAIN);
        const sunTimesS = getSunTimes(dayOfYear, ZONES.SHIP);

        const skyMinM = getWarpedSkyMinute(m, sunTimesM);
        const skyMinS = getWarpedSkyMinute(m, sunTimesS);

        const palM = palette(skyMinM);
        const palS = palette(skyMinS);

        // Crossfade between mountain and ship sky palettes across the 1.2s view transition
        const rawP = [0, 1, 2].map(k => lerpColor(palM[k], palS[k], viewBlend));

        // Physical lighting factors for Mountain view
        const sunAstroM = getSunAstronomical(m, dayOfYear, ZONES.MOUNTAIN);
        const dayM = clamp((sunAstroM.alt + 6) / 12);
        const warmM = Math.exp(-Math.pow(sunAstroM.alt - 1.5, 2) / 22) * clamp((sunAstroM.alt + 1.5) / 3);
        const goldenM = Math.max(Math.exp(-Math.pow(sunAstroM.alt - 6, 2) / 45), 0);
        const nightM = 1 - dayM;
        const sunriseM = Math.exp(-Math.pow((m - sunTimesM.sunrise) / 40, 2));
        const sunsetM = Math.exp(-Math.pow((m - sunTimesM.sunset) / 40, 2));

        // Physical lighting factors for Ship view
        const sunAstroS = getSunAstronomical(m, dayOfYear, ZONES.SHIP);
        const dayS = clamp((sunAstroS.alt + 6) / 12);
        const warmS = Math.exp(-Math.pow(sunAstroS.alt - 1.5, 2) / 22) * clamp((sunAstroS.alt + 1.5) / 3);
        const goldenS = Math.max(Math.exp(-Math.pow(sunAstroS.alt - 6, 2) / 45), 0);
        const nightS = 1 - dayS;
        const sunriseS = Math.exp(-Math.pow((m - sunTimesS.sunrise) / 40, 2));
        const sunsetS = Math.exp(-Math.pow((m - sunTimesS.sunset) / 40, 2));

        ctx.clearRect(0, 0, W, H);

        const mAlpha = clamp(1 - viewBlend);
        const sAlpha = clamp(viewBlend);

        const mSlide = slideDir > 0 ? -viewBlend * W * 0.92 : viewBlend * W * 0.92;
        const sSlide = slideDir > 0 ? (1 - viewBlend) * W * 0.92 : -(1 - viewBlend) * W * 0.92;

        if (mAlpha > 0.005) {
          renderMountain(now, m, rawP, dayM, warmM, goldenM, nightM, sunriseM, sunsetM, mAlpha, mSlide);
        }
        if (sAlpha > 0.005) {
          renderShip(now, m, rawP, dayS, warmS, goldenS, nightS, sunriseS, sunsetS, sAlpha, sSlide);
        }

        // Weather label cross-fade animation (fade out and in over 0.6 s, swap text at 0.3 s)
        if (_labelFadeStartTime >= 0) {
          const elapsed = (now - _labelFadeStartTime) * 0.001;
          if (elapsed < 0.3) {
            seasonLabelEl.style.opacity = String(clamp(1 - elapsed / 0.3));
          } else if (elapsed < 0.6) {
            if (seasonLabelEl.textContent !== _labelPendingText) {
              _currentLabelText = _labelPendingText;
              seasonLabelEl.textContent = _labelPendingText;
            }
            seasonLabelEl.style.opacity = String(clamp((elapsed - 0.3) / 0.3));
          } else {
            _currentLabelText = _labelPendingText;
            seasonLabelEl.textContent = _labelPendingText;
            seasonLabelEl.style.opacity = '1';
            _labelFadeStartTime = -1;
          }
        }

        // Clock, Phase, Season, and Moon labels
        if (now - lastUi > 80) {
          clock.textContent = formatTime(m);
          phaseLabel.textContent = phaseName(m);

          // Season label shows current weather derived from weather.rain and weather.thunder to match audio mixing
          const seasonInfo = getSeasonInfo(simTime);
          const sp = getSeasonParams(seasonInfo);
          let weatherName = 'CLEAR';
          if (weather.cycloneActive) {
            if (weather.cycloneStage === 0) weatherName = 'CYCLONE WARNING';
            else if (weather.cycloneInEye) weatherName = 'CYCLONE EYE';
            else weatherName = 'CYCLONE · ' + getIMDCategory(weather.cycloneWindSpeed).toUpperCase();
          } else {
            if (weather.thunder && weather.rain > 0.25) {
              weatherName = 'THUNDERSTORM';
            } else if (weather.rain >= 0.65) {
              weatherName = 'HEAVY RAIN';
            } else if (weather.rain >= 0.30) {
              weatherName = 'RAIN';
            } else if (weather.rain > 0.05) {
              weatherName = 'DRIZZLE';
            } else if (sp.season === 'WINTER' && m >= 360 && m <= 540 && weather.fog > 0.2) {
              weatherName = 'MORNING MIST';
            } else if (weather.fog > 0.3) {
              weatherName = 'FOG';
            } else if (sp.season === 'SUMMER' && weather.fog > 0.1) {
              weatherName = 'HAZE';
            } else if (sp.season === 'MONSOON') {
              weatherName = 'CLEARING';
            } else if (weather.cloud > 0.25) {
              weatherName = 'LIGHT CLOUD';
            } else {
              weatherName = 'CLEAR';
            }
          }
          const sLabel = weather.cycloneActive
            ? weatherName
            : `${sp.season} · ${weatherName}`;

          if (!_currentLabelText) {
            _currentLabelText = sLabel;
            _candidateLabelText = sLabel;
            _candidateHeldSince = now;
            seasonLabelEl.textContent = sLabel;
            seasonLabelEl.classList.add('visible');
            seasonLabelEl.style.opacity = '1';
          } else {
            if (sLabel !== _candidateLabelText) {
              _candidateLabelText = sLabel;
              _candidateHeldSince = now;
            }
            if (_candidateLabelText !== _currentLabelText && _labelFadeStartTime < 0 && (now - _candidateHeldSince >= 3000)) {
              _labelFadeStartTime = now;
              _labelPendingText = _candidateLabelText;
            }
          }

          // Moon phase label under season
          const curZone = currentView === 0 ? ZONES.MOUNTAIN : ZONES.SHIP;
          const moonAstroUI = getMoonAstronomical(simTime, m, dayOfYear, curZone);
          moonLabelEl.textContent = moonAstroUI.phaseName;

          // Debug readout (?debug=1)
          if (DEBUG && debugHudEl) {
            debugHudEl.style.display = 'block';
            const sAstro = getSunAstronomical(m, dayOfYear, curZone);
            const sTimes = getSunTimes(dayOfYear, curZone);
            debugHudEl.innerHTML = `
        <b>ZONE:</b> ${curZone.name} (${curZone.lat.toFixed(1)}°N, ${curZone.lon.toFixed(1)}°E) [Heading ${curZone.heading}°]<br>
        <b>DATE:</b> ${cal.dateString} (Day ${dayOfYear}) · <b>IST:</b> ${formatTime(m)}<br>
        <b>SUN:</b> Alt ${sAstro.alt.toFixed(1)}° · Az ${sAstro.az.toFixed(1)}° · Noon ${formatTime(sTimes.noon)} · Rise ${formatTime(sTimes.sunrise)} · Set ${formatTime(sTimes.sunset)}<br>
        <b>MOON:</b> Alt ${moonAstroUI.alt.toFixed(1)}° · Az ${moonAstroUI.az.toFixed(1)}° · Age ${moonAstroUI.age.toFixed(1)}d · ${moonAstroUI.phaseName} (${Math.round(moonAstroUI.illumFraction * 100)}%)
      `;
          }
          lastUi = now;
        }
      }

      /* ═══════════════════════════════════════════════════════════════════
         ANIMATION LOOP
         ═══════════════════════════════════════════════════════════════════ */
      let _frameErrorLogged = false;
      let _popWatcherPrev = null;
      let _popWatcherLastWarn = 0;

      function frame(now) {
        try {
          const dt = Math.min(100, now - last); last = now;
          // Time progression: 1440 simulated minutes per DAY_SECONDS (60 real seconds)
          const timeStep = _freeze ? 0 : dt * (1440 / (DAY_SECONDS * 1000));
          minute = (minute + timeStep) % 1440;
          simTime += timeStep;

          // Cloud drift
          _cloudOffset += dt * 0.00003 * (1 + weather.wind * 2);

          // Update weather
          const seasonInfo = getSeasonInfo(simTime);
          updateWeather(dt, minute, seasonInfo);

          // Ease viewBlend
          const target = currentView;
          const blendSpeed = dt / 1200;
          if (viewBlend < target) {
            viewBlend = Math.min(target, viewBlend + blendSpeed);
            if (viewBlend >= target) { viewBlend = target; transitioning = false; }
          } else if (viewBlend > target) {
            viewBlend = Math.max(target, viewBlend - blendSpeed);
            if (viewBlend <= target) { viewBlend = target; transitioning = false; }
          }

          // Pop watcher (?debug=1 only): warn if any key weather variable changed by > 0.05 in one frame
          if (DEBUG) {
            if (_popWatcherPrev) {
              const vars = ['rain', 'cloud', 'fog', 'wind', 'darkness'];
              const popped = [];
              for (const v of vars) {
                if (Math.abs(weather[v] - _popWatcherPrev[v]) > 0.05) {
                  popped.push(v);
                }
              }
              if (popped.length > 0 && now - _popWatcherLastWarn >= 1000) {
                _popWatcherLastWarn = now;
                console.warn(`[POP WATCHER] Per-frame change > 0.05: ${popped.join(', ')}`);
              }
            }
            _popWatcherPrev = {
              rain: weather.rain,
              cloud: weather.cloud,
              fog: weather.fog,
              wind: weather.wind,
              darkness: weather.darkness
            };
          }

          render(now);
        } catch (err) {
          if (!_frameErrorLogged) {
            console.error("Frame render error:", err);
            _frameErrorLogged = true;
          }
        }
        requestAnimationFrame(frame);
      }

      /* ═══════════════════════════════════════════════════════════════════
         REAL AUDIO ENGINE: Live mixed environmental ambience
         ═══════════════════════════════════════════════════════════════════ */
      let isMuted = false;
      try {
        isMuted = localStorage.getItem('celestial_muted') === 'true';
      } catch (e) { }
      let masterLevel = isMuted ? 0 : 1;

      let audioMode = (window.location.protocol === 'file:') ? 'html' : 'webaudio';
      let audioCtx = null;
      let masterGainNode = null;
      let ambienceBus = null;
      let rainFilter = null;
      let rainBus = null;
      let audioEngineStarted = false;
      let loadedCount = 0;
      let firstFetchFailed = false;

      const LOOP_NAMES = [
        'rain-light', 'rain-steady', 'rain-heavy', 'rain-cyclone',
        'wind-light', 'wind-strong', 'wind-cyclone',
        'sea-calm', 'sea-storm', 'crickets-night'
      ];

      const ONESHOT_NAMES = [
        'thunder-close', 'thunder-mid', 'thunder-far', 'thunder-deep'
      ];

      // Web Audio mode state
      const loopGains = {};
      const loopSources = {};
      const thunderBuffers = {};
      let activeThunderCount = 0;
      let audioDebugVisible = false;
      const audioDebugEl = document.getElementById('audioDebugHud');

      // HTML mode state
      const htmlAudioElements = {};
      const htmlLayerLevels = {};
      const htmlLayerTargets = {};
      const htmlLayerTaus = {};
      let htmlAudioInited = false;
      let htmlAudioNoticeShown = false;

      function showHtmlAudioNotice() {
        if (htmlAudioNoticeShown || audioMode !== 'html') return;
        htmlAudioNoticeShown = true;
        try {
          const el = document.createElement('div');
          el.id = 'audioBasicNotice';
          el.textContent = 'Sound is in basic mode. Open via http://localhost for the full mix.';
          el.style.position = 'fixed';
          el.style.bottom = '24px';
          el.style.left = '50%';
          el.style.transform = 'translateX(-50%)';
          el.style.zIndex = '9999';
          el.style.padding = '8px 16px';
          el.style.background = 'rgba(8, 12, 24, 0.85)';
          el.style.border = '1px solid rgba(255, 255, 255, 0.18)';
          el.style.borderRadius = '6px';
          el.style.fontFamily = 'Inter, ui-sans-serif, system-ui, -apple-system, sans-serif';
          el.style.fontSize = '11px';
          el.style.letterSpacing = '0.02em';
          el.style.color = 'rgba(255, 255, 255, 0.85)';
          el.style.boxShadow = '0 4px 18px rgba(0, 0, 0, 0.35)';
          el.style.pointerEvents = 'none';
          el.style.transition = 'opacity 0.6s ease';
          el.style.opacity = '0';
          document.body.appendChild(el);
          requestAnimationFrame(() => { el.style.opacity = '1'; });
          setTimeout(() => {
            el.style.opacity = '0';
            setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 700);
          }, 6000);
        } catch (e) { }
      }

      function initHtmlAudioElements() {
        if (htmlAudioInited) return;
        htmlAudioInited = true;
        showHtmlAudioNotice();

        let settled = 0;
        function markOne(success) {
          if (success) loadedCount++;
          settled++;
          if (settled === 14) {
            console.info('AUDIO MODE:', audioMode, 'loaded', loadedCount, '/ 14');
          }
        }

        LOOP_NAMES.forEach(name => {
          const a = new Audio('sounds/' + name + '.mp3');
          a.loop = true;
          a.volume = 0;
          a.preload = 'auto';
          htmlAudioElements[name] = a;
          htmlLayerLevels[name] = 0;
          htmlLayerTargets[name] = 0;
          htmlLayerTaus[name] = 1.5;

          let fired = false;
          const onOk = () => {
            if (!fired) {
              fired = true;
              markOne(true);
            }
          };
          a.addEventListener('canplaythrough', onOk, { once: true });
          a.addEventListener('loadeddata', onOk, { once: true });
          a.addEventListener('error', (e) => {
            console.warn('Audio file failed to load: ' + name, e);
            if (!fired) {
              fired = true;
              markOne(false);
            }
          }, { once: true });

          if (a.readyState >= 2) onOk();
        });

        ONESHOT_NAMES.forEach(name => {
          const a = new Audio('sounds/' + name + '.mp3');
          a.preload = 'auto';
          a.load();
          htmlAudioElements[name] = a;

          let fired = false;
          const onOk = () => {
            if (!fired) {
              fired = true;
              markOne(true);
            }
          };
          a.addEventListener('canplaythrough', onOk, { once: true });
          a.addEventListener('loadeddata', onOk, { once: true });
          a.addEventListener('error', (e) => {
            console.warn('Audio file failed to load: ' + name, e);
            if (!fired) {
              fired = true;
              markOne(false);
            }
          }, { once: true });

          if (a.readyState >= 2) onOk();
        });
      }

      function playHtmlLoops() {
        initHtmlAudioElements();
        const promises = [];
        let anyRejected = false;
        for (const name of LOOP_NAMES) {
          const a = htmlAudioElements[name];
          if (a && a.paused) {
            try {
              const p = a.play();
              if (p && typeof p.catch === 'function') {
                promises.push(
                  p.catch(() => {
                    anyRejected = true;
                  })
                );
              }
            } catch (err) {
              anyRejected = true;
            }
          }
        }
        return Promise.all(promises).then(() => !anyRejected);
      }

      function updateHtmlAudioVolumes() {
        if (audioMode !== 'html') return;

        const targetMaster = isMuted ? 0 : 1;
        masterLevel += (targetMaster - masterLevel) * (1 - Math.exp(-0.1 / 0.133));
        if (Math.abs(masterLevel - targetMaster) < 0.001) {
          masterLevel = targetMaster;
        }

        for (const name of LOOP_NAMES) {
          const target = htmlLayerTargets[name] || 0;
          const tau = htmlLayerTaus[name] || 1.5;
          let v = htmlLayerLevels[name] || 0;
          v += (target - v) * (1 - Math.exp(-0.1 / tau));
          if (Math.abs(target - v) < 0.0001) {
            v = target;
          }
          htmlLayerLevels[name] = v;

          const a = htmlAudioElements[name];
          if (a) {
            a.volume = clamp(v * masterLevel, 0, 1);
          }
        }
      }

      function getLayerLevel(name) {
        if (audioMode === 'webaudio') {
          return loopGains[name]?.gain.value || 0;
        }
        return htmlLayerLevels[name] || 0;
      }

      function getMasterLevel() {
        if (audioMode === 'webaudio' && masterGainNode) {
          return masterGainNode.gain.value;
        }
        return masterLevel;
      }

      function setLayerGain(name, target, tau) {
        tau = tau || 1.5;
        if (audioMode === 'webaudio') {
          const g = loopGains[name];
          if (g && audioCtx) {
            g.gain.setTargetAtTime(target, audioCtx.currentTime, tau);
          }
        } else {
          htmlLayerTargets[name] = target;
          htmlLayerTaus[name] = tau;
        }
      }

      function loadAudioBuffer(name) {
        return fetch('./sounds/' + name + '.mp3')
          .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.arrayBuffer();
          })
          .then(ab => {
            if (!audioCtx) return null;
            return audioCtx.decodeAudioData(ab);
          })
          .catch(err => {
            console.warn('Audio file failed to load: ' + name, err);
            if (audioMode === 'webaudio' && loadedCount === 0 && !firstFetchFailed) {
              firstFetchFailed = true;
              switchToHtmlMode();
            }
            return null;
          });
      }

      function switchToHtmlMode() {
        if (audioMode === 'html') return;
        audioMode = 'html';
        if (audioCtx) {
          try { audioCtx.close(); } catch (e) { }
          audioCtx = null;
        }
        loadedCount = 0;
        initHtmlAudioElements();
        audioEngineStarted = true;
        if (!isMuted) {
          playHtmlLoops();
        }
      }

      function initAudioEngine() {
        if (audioMode === 'html') {
          showHtmlAudioNotice();
        }
        if (audioEngineStarted) {
          if (audioMode === 'webaudio' && audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          if (audioMode === 'html' && !isMuted) {
            playHtmlLoops();
          }
          return;
        }

        if (audioMode === 'webaudio') {
          initWebAudioEngine();
        } else {
          audioEngineStarted = true;
          initHtmlAudioElements();
          if (!isMuted) {
            playHtmlLoops();
          }
        }
      }

      function initWebAudioEngine() {
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          console.warn('Web Audio API not supported, falling back to HTML mode', e);
          switchToHtmlMode();
          return;
        }

        // 1. Master Chain: every layer gain -> ambienceBus -> masterGain -> destination
        masterGainNode = audioCtx.createGain();
        masterGainNode.gain.value = isMuted ? 0 : 1;
        masterGainNode.connect(audioCtx.destination);

        ambienceBus = audioCtx.createGain();
        ambienceBus.gain.value = 1.0;
        ambienceBus.connect(masterGainNode);

        // 2. Rain Bus with gentle lowpass filter (5500 Hz for Mountain, 22000 Hz for Ship)
        rainFilter = audioCtx.createBiquadFilter();
        rainFilter.type = 'lowpass';
        rainFilter.frequency.value = viewBlend < 0.5 ? 5500 : 22000;
        rainFilter.connect(ambienceBus);

        rainBus = audioCtx.createGain();
        rainBus.gain.value = 1.0;
        rainBus.connect(rainFilter);

        // 3. Create GainNodes for each loop, connect to appropriate bus
        for (const name of LOOP_NAMES) {
          const gn = audioCtx.createGain();
          gn.gain.value = 0;
          if (name.startsWith('rain-')) {
            gn.connect(rainBus);
          } else {
            gn.connect(ambienceBus);
          }
          loopGains[name] = gn;
        }

        audioEngineStarted = true;

        let settled = 0;
        function markLoaded(success) {
          if (success) loadedCount++;
          settled++;
          if (settled === 14) {
            console.info('AUDIO MODE:', audioMode, 'loaded', loadedCount, '/ 14');
          }
        }

        // Preload and start all loops (once, loop = true, gain 0)
        LOOP_NAMES.forEach(name => {
          loadAudioBuffer(name).then(buf => {
            if (buf && audioCtx) {
              try {
                const src = audioCtx.createBufferSource();
                src.buffer = buf;
                src.loop = true;
                src.connect(loopGains[name]);
                src.start(0);
                loopSources[name] = src;
              } catch (e) {
                console.warn('Failed to start loop ' + name, e);
              }
              markLoaded(true);
            } else {
              markLoaded(false);
            }
          });
        });

        // Preload thunder one-shots
        ONESHOT_NAMES.forEach(name => {
          loadAudioBuffer(name).then(buf => {
            if (buf) {
              thunderBuffers[name] = buf;
              markLoaded(true);
            } else {
              markLoaded(false);
            }
          });
        });

        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function updateAudioMix() {
        if (!audioEngineStarted) return;
        const now = audioCtx ? audioCtx.currentTime : performance.now() / 1000;

        // ── 1. VIEW CROSSFADE ──
        const vBlend = clamp(viewBlend);
        const targetRainFreq = mix(5500, 22000, vBlend);
        if (rainFilter && audioCtx) {
          rainFilter.frequency.setTargetAtTime(targetRainFreq, now, 1.5);
        }
        const windViewMult = mix(0.85, 1.15, vBlend);

        // ── 2. SEA STATE PHYSICS ──
        const seasonInfo = getSeasonInfo(simTime);
        const sp = getSeasonParams(seasonInfo);
        const weatherWindBonus = weather.cycloneActive
          ? 0
          : (weather.wind * (sp.season === 'MONSOON' ? 4.8 : (weather.thunder ? 6.2 : 2.8)));
        const windSpeed = weather.cycloneActive
          ? weather.cycloneWindSpeed
          : (sp.windBase + weatherWindBonus);
        const rawHs = (0.21 * windSpeed * windSpeed / g_) * SEA_FETCH_FACTOR;
        const effectiveHs = (weather.cycloneActive && weather.cycloneSwell)
          ? Math.max(rawHs, (0.21 * weather.cycloneSwell * weather.cycloneSwell / g_) * SEA_FETCH_FACTOR)
          : rawHs;
        const clampedHs = Math.min(12, effectiveHs);

        // Sea (ship view only, mountain = 0, sea-calm ~0.6 low Hs, sea-storm full at Hs >= 6m)
        // In cyclone eye: sea-storm stays loud
        const stormHsFrac = clamp((clampedHs - 0.8) / 5.2);
        const targetSeaCalm = 0.60 * (1 - stormHsFrac) * vBlend;
        const targetSeaStorm = 0.75 * stormHsFrac * vBlend;

        // ── 3. RAIN INTENSITY CROSSFADES ──
        const R = clamp(weather.rain);
        let rLight = 0, rSteady = 0, rHeavy = 0, rCyclone = 0;

        if (R > 0.02) {
          if (R <= 0.30) {
            const u = (R - 0.02) / 0.28;
            if (u <= 0.5) {
              rLight = mix(0, 0.80, u / 0.5);
              rSteady = 0;
            } else {
              const cross = (u - 0.5) / 0.5;
              rLight = 0.80 * (1 - cross);
              rSteady = 0.80 * cross;
            }
          } else if (R <= 0.65) {
            const cross = (R - 0.30) / 0.35;
            rSteady = 0.80 * (1 - cross);
            rHeavy = 0.80 * cross;
          } else {
            rHeavy = 0.80;
          }

          if (weather.thunder && R > 0.25) {
            rHeavy = Math.max(rHeavy, 0.70);
            rSteady = Math.min(rSteady, 0.20);
          }

          if (weather.cycloneActive) {
            const cFrac = clamp((weather.cycloneWindSpeed - 16) / 12);
            rCyclone = 0.80 * clamp(R / 0.5) * cFrac;
            rHeavy *= (1 - cFrac);
            rSteady *= (1 - cFrac);
            rLight *= (1 - cFrac);
          }
        }

        // Cyclone eye: rain drops to about 10%
        if (weather.cycloneInEye) {
          rLight *= 0.10;
          rSteady *= 0.10;
          rHeavy *= 0.10;
          rCyclone *= 0.10;
        }

        // ── 4. WIND SPEED CROSSFADES ──
        let wLight = 0, wStrong = 0, wCyclone = 0;
        if (windSpeed <= 12) {
          const u = clamp((windSpeed - 4) / 8);
          wLight = mix(0.15, 0.75, u);
        } else if (windSpeed <= 22) {
          const u = (windSpeed - 12) / 10;
          wLight = 0.75 * (1 - u);
          wStrong = 0.75 * u;
        } else if (windSpeed <= 30) {
